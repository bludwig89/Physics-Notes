    - C1b-theta-squared-not-minus-one
    reason: swap the kinetic-sector isospin twist tau_2 for the trivial I2 in the B1/B2/C1 legs (the positive
      result's own Theta'). With I2 the operator identity fails (B1, B2 turn O(1) red, since I2 does not
      satisfy the SU(2) pseudoreality identity tau_2 U tau_2^-1 = U* that the proof needs), and Theta^2
      reverts to F328's Kramers -1 (since sigma_y (x) I2 is still purely imaginary, same Kramers class
      as the free-sector theorem) -- so C1 (which asserts +1) turns red for exactly the reason the docstring
      predicts, and C1b (which asserts NOT -1) turns red too, confirming the flip is real and specific
      to the tau_2 twist. Every OTHER leg -- X0 (module cross-check, isospin-independent), A1 and D1 (facts
      about tau_2 alone, independent of which Theta the operator theorem itself uses), B3 (unitarity,
      isospin-independent), D2 (the mass no-go, present regardless of this switch), D3 (the Lambda-search
      control, independent), and E1 (the zero-coupling cross-module mismatch, where U=V=I makes the isospin
      choice irrelevant) -- stays green. VERIFIED RED 2026-09-09.
  summary: 'F378 (ledger row A4r, rubric row A4). Extends F328''s Theta to the SU(2)_L-coupled BCC Dirac
    doublet. X0 cross-checks the closed-form momentum-diagonal 8x8 unitary against the real casim.engine.gauge.weak_wmu.covariant_dirac_doublet_step
    at a uniform link (machine precision). E1 shows that module''s OWN architecture (branch +, paired
    with the true branch -, not with its own dagger the way dirac_bcc.py does) already fails F328''s identity
    at ZERO gauge coupling (U=V=I) -- a pre-existing cross-module discretisation mismatch, not a gauge-coupling
    effect. To isolate the actual gauge-coupling question, A/B/C graft a uniform SU(2) link directly into
    dirac_bcc.py''s OWN branch+/dagger architecture: A1 verifies the SU(2) pseudoreality identity tau_2
    U tau_2^-1 = U* for every U (generalising F328 identity I); B1/B2/B3 prove Theta'' = Sigma.(sigma_y
    (x) tau_2 (+) sigma_y (x) tau_2).K exactly intertwines the SU(2)-kinetic-coupled walk (scalar mass)
    with its inverse, machine precision, random (k, m, U) and at edge cases, with D_grafted exactly unitary;
    C1/C1b show Theta''^2 = +1, NOT F328''s Kramers -1 -- a second pseudoreal twist flips the antiunitary
    involution class. D is the companion no-go: D1 confirms tau_2 V^T tau_2^-1 = V^-1 (a true but DIFFERENT
    identity from the one the mass sector needs); D2 shows that once the model''s own SU(2)-gauged (Stueckelberg-type)
    mass link is switched on, Theta'' breaks at O(1) regardless of the link choice; D3 is a 500-sample
    Monte-Carlo search over random unitary 2x2 Lambda confirming no fixed isospin operator solves the
    mass sector''s required identity for two fixed non-commuting SU(2) elements simultaneously, consistent
    with the general fact that V -> V^T is a group anti-automorphism while conjugation is always an automorphism,
    and the two coincide only on an abelian group (SU(2) is not). Does NOT claim the physical SU(2)_L
    gauge theory violates CPT: every test holds the classical link fixed under the antiunitary map, and
    letting Theta also transform the background field is a different, unattempted question (module docstring
    Scope section; CL285''s falsifier text and ledger row A4r''s own caution both flag that a genuine
    CPT-violation claim needs its own card and a named experimental confrontation).'
- id: F399-composite-scalar-fermion-coupling
  kind: assertion
  tier: gate
  sector: particles
  module: casim.engine.particles.derive_composite_scalar_fermion_coupling
  entry: check_composite_scalar_fermion_coupling
  params: {}
  expect:
