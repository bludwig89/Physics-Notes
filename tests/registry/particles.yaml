    tol: 1.0e-08
  findings:
  - F399
  - F73
  - F74
  - F77
  control:
  - params:
      channel: PS
    reds:
    - sigma_coupling_not_universal
    reason: checks the PSEUDOSCALAR (pion) Goldberger-Treiman ratio instead of the scalar one -- the pion
      ratio genuinely IS a coupling-independent constant (exact chiral-symmetry theorem, spread 6.2e-12
      across the same coupling sweep, vs. the scalar's 0.81), so the leg (which requires spread > 0.5)
      must go red, while the other three legs (unaffected by which channel this one leg's sweep uses)
      stay green.
  - params:
      G_ab: 0.01
    reds:
    - species_locality_exact
    reason: a nonzero cross-species contact coupling in the 2-flavour toy model makes the RPA propagator
      matrix genuinely mix (off-diagonal residual 0.10, vs. exactly 0.0 at G_ab=0) -- this is precisely
      the missing ingredient (an explicit Yukawa-like cross-species vertex) a kappa-framework-compatible
      universal coupling would require and that NB2-001 established this model supplies nowhere; the other
      three legs (independent of the toy model) stay green.
  notes: 'F399 -- Notebook v2 prompt B: does the F73 Cooper-pair Higgs candidate have a natural coupling
    to fermions? Extracts the scalar-fermion residue coupling g_sigma_qq = 1/sqrt(2 Nc Nf K(4M^2)) from
    F77''s own NJL machinery, by the same residue-at-the-pole formula F77 already uses for g_pi_qq (Goldberger-Treiman)
    -- independently reimplemented and cross-checked against F77''s own published fit (M, f_pi, GT residual
    5.8e-13). K(4M^2) is finite (no singularity at the sigma''s own marginal-binding threshold), so the
    coupling exists and is computable: g_sigma_qq = 2.105 at the canonical fit. Unlike the pion''s exact
    GT ratio (coupling-independent, spread 6e-12), the analogous scalar ratio g_sigma_qq*f_pi/M is NOT
    universal -- it varies by 81% across a coupling sweep, a genuine dynamical NJL output with no protecting
    symmetry. The harder, negative result: species locality is proven as an EXACT linear-algebra fact
    (not approximated) on a 2-flavour toy NJL model -- the RPA propagator matrix D=[(2G)^-1-Pi]^-1 is
    exactly block-diagonal whenever the cross-species contact G_ab=0 (Pi is block-diagonal by construction,
    since no one-loop diagram connects two different fermion species without an explicit G_ab vertex),
    so a sigma built from one species'' own condensate has identically zero coupling to any other species.
    This model supplies no G_ab term anywhere (NB2-001''s "no Yukawa mechanism" finding) -- closing Notebook
    v2 prompt B: not "not yet built", the necessary structural consequence of the model''s own already-established
    mass mechanism.'
