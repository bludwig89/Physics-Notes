  control:
  - params:
      use_naive_theta: true
    reds:
    - B1-theta-D-theta-inv-eq-Dinv
    - B2-edge-cases
    - C1-theta-squared-minus-one
    - E1-realspace-cpt-roundtrip
    reason: swap THETA's internal matrix M for plain Sigma (block swap only, no sigma_y twist, still composed
      with K) -- the naive parity-like reflection ca-reference.md's own Time-reversibility section effectively
      tests. Reddens exactly B1 (the operator identity fails, since block-swap alone does not conjugate
      A^+ into A^-), B2 (same failure at the edge-case momenta/masses), C1 (Sigma^2=+1, not the Kramers
      -1 the real THETA has), and E1 (the real-space many-step round trip misses by O(0.09), not floating
      noise). Every OTHER leg -- A1/A2 (lattice-embedding identities, independent of which THETA is tested),
      B3 (unitarity of D(k) itself), C2 (M is still unitary even without the twist), D1-D3 (the parity
      no-go, which is about D(k) alone), and E2 (plain invertibility, which every unitary CA has for free)
      -- stays green, which is what proves B1/B2/C1/E1 are testing the sigma_y twist specifically and
      not a bookkeeping tautology. VERIFIED RED 2026-08-26.
  summary: 'F328 (rubric row A4, ledger row A4r). Twelve legs in five blocks. A: the two lattice-embedding
    identities behind D(k) itself -- A1 conjugation at fixed k, A2 conjugation-equals-branch-swap-plus-momentum-flip
    -- both exact 0.0 over 500 random momenta, independent of which THETA is under test. B: the core operator
    theorem THETA D(k) THETA^-1 = D(k)^-1 for THETA = Sigma . (sigma_y (+) sigma_y) . K, exact 0.0 over
    500 random (k, m) samples (B1) and at five edge cases including k=0, an axis-aligned k, and |m| in
    {0, 1} with no small-k expansion anywhere (B2); D(k) itself is exactly unitary to floating precision
    (B3). C: THETA^2 = -1 exactly, the Kramers antiunitary-involution signature, not +1 (C1); the internal
    matrix M is exactly unitary (C2). D: the companion no-go -- no fixed unitary parity can exist at any
    finite generic k, since omega(k) != omega(-k) there (D1, nonzero over 500 samples, a re-derivation
    of F301''s chirality-odd defect as a spectral fact), vanishing identically on the cubic axes as F301
    requires (D2), and a naive parity-only operator (block swap, no twist, no K) misses D(-k) by O(1)
    -- not a small defect (D3). E: a real-space, many-step (N=12), nonlinear FFT round trip under the
    real THETA returns to the reflected/conjugated/branch-swapped start to 8.5e-16 (E1), contrasted with
    the trivial fact that plain forward-then-dagger application returns to the start for any unitary CA,
    which is not a test of any antiunitary symmetry (E2). Explicitly does NOT reuse F321''s theta_QCD
    reality result (a different theorem about a different object, rubric row B11) and does NOT claim the
    gauge-coupled sector, which is named open (ledger row A4r).'
