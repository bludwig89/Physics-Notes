- id: F22-rho-identity-and-offshell
  kind: assertion
  tier: gate
  sector: interactions
  findings:
  - F15
  - F22
  module: casim.engine.interactions.derive_velocity_addition
  entry: check_offshell_and_control
  params:
    m: 0.5
    k: 0.001
    v: 1.0e-06
    tol: 1.0e-14
  control:
  - params:
      tol: 0
    reds:
    - identity_holds
    reason: rho_num (a sympy limit, evaluated numerically) and rho_from_f15 (the hand-written derive_beta_LV.beta_LV
      float formula) are two genuinely separate computational routes to the same closed form, so their
      difference is floating-point noise, not literal zero. tol=0 removes all headroom for that noise,
      so numeric_identity -- and with it identity_holds -- must go red.
  expect:
    exactness: exact
    tol: 0
  results:
  - test-results/F22_rho_identity_and_offshell.json
  notes: 'path dropped 2026-08-08: this record declared BOTH a pytest file and an `entry:`, so conftest.pytest_ignore_collect
    hid the file and its test functions never ran anywhere -- the ambiguity tests/casim/test_registry_entries.py
    refuses. Dropping `entry:` instead was wrong: a gate-tier record whose path sits outside tests/casim/
    MUST be entry-driven or test_registry_integrity''s `bare pytest == the gate tier` equality breaks.
    So the gate contract stays here as a registry-only record (the shape F20-wavepacket-group-velocity,
    F301 and F314-photon-packet-propagation already use), and tools/gen_test_registry.py scaffolds a separate
    battery record for the file, whose own test functions now run.'
  note: 'F22 remediation (review 2026-08-04, verdict OVERSTATED). Replaces a check that could not fail.
    The module previously "verified" rho = 1 - 2*beta_LV by writing beta_LV_sym = (1 - rho)/2 and then
    simplifying rho - (1 - 2*beta_LV_sym) -- which is x - (1 - 2(1-x)/2) == 0 for ANY expression; the
    referee got residual 0 from a deliberately wrong rho = m/asin(m) and then from rho = 42. Now the two
    sides have separate origins: LEFT is sympy''s limit of u_p/u_g taken from the dispersion acos(n cos(k/sqrt2))
    itself, RIGHT is 1 - 2*beta_LV with beta_LV imported from casim.engine.interactions.derive_beta_LV,
    which carries its own gate record (F15-closed-form-lv-coefficients) asserting that closed form against
    the Legendre construction defining it. The acos(sqrt(1-m^2)) = asin(m) step sympy will not close on
    its own is asserted separately at 50 dps over 199 points (residual 6.7e-50). REAL FAILURE MODE, and
    it is asserted directly: `control_fails` requires the same check to go RED under rho_override="42".
    The record also carries the corrected content of F22 claim 1 -- the linear SR boost does NOT preserve
    the arccos mass shell, failing at first order in v with coefficient 1/rho - 1 (measured -0.0930513
    vs predicted -0.0931003 at m=0.5, rel 5.3e-4) -- asserted as NONZERO, i.e. the test asserts the failure
    the finding claimed did not occur. Retracting claim 1 in the finding''s own headline is ESCALATED
    to Ben; this record measures it either way.'
