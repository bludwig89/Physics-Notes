- id: F15-closed-form-lv-coefficients
  path: tests/findings/test_F15_closed_form_beta_LV.py
  kind: assertion
  tier: gate
  sector: interactions
  findings:
  - F12
  - F15
  module: tests.findings.test_F15_closed_form_beta_LV
  entry: check_all
  params:
    lead_denom: 6
    next_num: 11
    next_denom: 90
    tol: 0.0001
  control:
  - params:
      lead_denom: 7
    reason: 'W4 is the records designated failure mode per the module docstring: beta_LV(m) = -m^2/6 -
      11 m^4/90 + O(m^6) is a fixed closed-form result. lead_denom=7 was already verified by hand on 2026-08-03
      (see the note below) to drop check_all to 5 of 6 passing checks, flipping the records overall assert.'
  expect:
    exactness: exact
    tol: 1.0e-12
  results:
  - test-results/F15_closed_form_beta_LV.json
  note: 'Closed-form SR-2 Lorentz-violation coefficients (2D-square QCA, m in (0,1) open at both ends).
    The load-bearing check W1 does NOT restate the module: the module expands acos(n cos u) in u and reverts
    the series u -> beta, while W1 uses the exact change of variable t = cos u, which closes R(beta) in
    finite terms, and expands THAT. Two routes, exact agreement (8.3e-17 worst residual at exact rational
    m). W3 closes the item the original finding left open -- gamma_LV never flips sign, because tan(theta)
    > theta makes every term of every coefficient negative on (0,1). W5 shows the lattice spacing a is
    decorative: beta_LV is independent of a (spread 1.3e-54 at 50 dps) because omega depends on k only
    via u = k a and c_lat = a. W6 documents that the numerical floor is subtractive cancellation ~eps/(|beta_LV|
    beta^2), NOT the "FFT/round-off floor" the original finding claimed -- there is no FFT in the module.

    FAILURE MODE (attack 7): lead_denom, next_num and next_denom are the small-m rational constants -m^2/6
    - 11 m^4/90. W4 runs in mpmath at 50 dps and asserts the m^6 residual converges to the third coefficient
    -191/1890; perturbing any of the three params fails the record. Verified 2026-08-03: lead_denom=7,
    next_num=12 and next_denom=91 each give 5/6.

    W4/W5/W6 are mpmath because in float64 they are destroyed by the very cancellation W6 diagnoses --
    a float64 W4 reports noise (spread 390) and would have to be loosened until it could no longer fail.

    '
  evidence:
    mentions:
    - F01
    - F15
    pytest_funcs: false
    has_assert: true
    has_main: true
    lines: 391
    n_test_funcs: 0
    artifacts_written: []
    artifact_rule: {}
    artifacts_read_only: []
    summary: F15 — Closed-form SR-2 Lorentz-violation coefficients, verified independently.
