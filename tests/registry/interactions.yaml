- id: F245-l1-curl-coefficient
  kind: assertion
  tier: gate
  sector: interactions
  module: casim.engine.interactions.derive_curl_subleading
  entry: check_closed_forms
  control:
  - params:
      alpha_on_axis_override: -0.01
    reason: 'alpha_on_axis_override is a new debug-only param (added 2026-09-06, default None -- identical
      to prior behaviour), mirroring the rho_override pattern already used by F22. A2 is an exact (tolerance-0)
      rational compare against -1/96, so any wrong on-axis value must fail it. Measured 2026-09-06: AssertionError
      on A2 alone.'
  expect:
    exactness: machine
    tol: 1.0e-11
  findings:
  - F7
  - F245
  summary: 'F245 (open-derivation L1) — closed forms for the composite-photon curl-residual subleading
    coefficients. Six checks. 2D: alpha(p) = (cos 4p - 9)/768 at eight angles (worst 2.8e-19), on-axis
    exactly -1/96 as a rational compare (the leg F245 derives algebraically), and the independent algebraic
    series sqrt2 sin(k/(2 sqrt2))/k returning the same -1/96. 3D: beta(k_hat) = -(sqrt2/12) kx ky kz across
    six rational directions, vanishing on every coordinate plane (the T2/xyz cubic harmonic), and Finding
    7''s reported 0.01883 reproduced as beta at one random direction — the leg that stops a later reader
    re-promoting a seed artifact to a fundamental constant. Written 2026-08-03 by gap #5 of the 2026-08-02
    completeness sweep: the module was registered dead_candidate while backing four live exactness-inventory
    rows, and its verify() only printed, so the claim could not fail. Records one measured discrepancy:
    F245 reports the 3D worst residual as 9e-15; re-measured it is 4.0e-12 (Richardson conditioning, not
    a failure of the closed form).

    '
- id: F246-l2-curl-coefficient
  kind: assertion
  tier: gate
  sector: interactions
  module: casim.engine.interactions.derive_f26_dispersion
  entry: check_closed_forms
  control:
  - params:
      c3_111_override: -0.01
    reason: 'c3_111_override is a new debug-only param (added 2026-09-06, default None -- identical to
      prior behaviour), mirroring the rho_override pattern already used by F22. C3 is asserted to 1e-55
      (the mpmath arithmetic floor, not a real tolerance) against -sqrt3/486, so any wrong value must
      fail it. Measured 2026-09-06: AssertionError on C3 alone.'
  expect:
    exactness: machine
    tol: 1.0e-17
  findings:
  - F26
  - F30
  - F246
  summary: 'F246 (open-derivation L2) — subleading coefficients of the F26 even-rotation curl law. Five
    checks. The structural leg is the strongest: all EVEN-power dispersion corrections vanish identically
    because Omega_even is an even function of the scalar k, and it is checked DIFFERENTIALLY — c2 and
    c4 go to the fit floor for the even law while the single-chirality law keeps them at -0.032 and -2.0e-4,
    so the vanishing is the even symmetrisation doing work rather than a fit artifact. Then the closed
    form c3(k_hat) = -(sqrt3/216)(p + 3q) across ten directions (worst 4.5e-19), exact luminality along
    <100>, and the body-diagonal extremum c3(111) = -sqrt3/486. Asserts the physical reading too: the
    F26 photon carries no CPT-odd k^2 Lorentz violation, so its leading vacuum-dispersion signature is
    the CPT-even cubic |k|^3 — the form the GRB/AGN bounds constrain. Written 2026-08-03 by gap #5 of
    the 2026-08-02 completeness sweep.

    '
- id: F247-q3-omega-degeneracy
