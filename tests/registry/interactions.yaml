- id: F142-dielectric-noconfine
  kind: assertion
  tier: gate
  sector: interactions
  findings:
  - F142
  - F139
  - F86
  - F99
  module: casim.engine.interactions.derive_dielectric_noconfine
  entry: check_dielectric_noconfine
  params:
    Phi: 12.0
    box_sizes:
    - 61
    - 91
    - 141
    nit: 8000
    bag_power: 2
  expect:
    exactness: quantitative
    tol: 0.02
  control:
  - params:
      bag_power: 1
    reds:
    - T2a_spread_exponent
    - T2b_box_tension_falls
    reason: make the bag potential LINEAR in the conductivity instead of quartic - the alternative the
      finding's own section 5 names ("a potential whose cost-per-conductivity stays bounded below"), which
      nothing had ever evaluated. The spread-thin minimiser then gives sigma ~ A^(-(p-1)/(p+1)) = A^0,
      so the analytic decade ratio goes 10^(1/3) = 2.1544 -> 1.0000 and the gradient-flow tension stops
      falling with box size (MEASURED 790, 1546, 4612 at L = 61, 91, 141 - it rises). T1, T3 and T4 never
      touch the bag exponent and stay green. Without this the no-go is a statement about one numerical
      sweep rather than about the exponent.
  summary: 'F142 - the colour-dielectric tube cannot carry F86''s exact sigma = 2 pi v^2 n. Five legs,
    one per row of the finding''s section 4 table: T1 the BPS dictionary gives the thin-wall prefactor
    1/sqrt2 = 0.70710678 (not 1) to 1e-16; T2a the spread-thin minimiser gives sigma ~ A^(-1/3), decade
    ratio 2.154434690 = 10^(1/3) to 1e-15; T2b a direct gradient-flow minimisation in a growing box FALLS
    - sigma(61, 91, 141) = 1.3745, 1.0412, 0.7714, tracking L^(-2/3) to 1.88 % (< 2 %); T3 SU(3) Casimir
    ratios 1, 9/4, 5/2, 9/2 in exact rationals; T4 both the Casimir and sine k-string laws give sigma_2/sigma_1
    = 1 for SU(3) and DISAGREE for SU(4) (4/3 vs sqrt2), so the degeneracy is a property of N = 3.'
  note: 'Written 2026-08-18 for completeness row H8. F142 was one of sixteen findings the index carried
    as `no test record`, and its module was described as "self-checking": the checking was three asserts
    inside a printing `main()` that no runner reads, and T3/T4 - two of the five rows the finding tabulates
    and says "all assertions in derive_dielectric_noconfine.py pass" about - had no assertion in the module
    at all. This record executes all five. T3/T4 are new code (`su3_casimir_ratios`, `su_n_k_string_ratios`),
    in Fractions so the residual against the tabulated ratios is identically zero rather than 1e-16. `spread_tension`
    and `tube_tension_box` gained a `bag_power` argument, which is what makes the control above possible;
    at the default p = 2 both are bit-identical to the committed behaviour. nit was cut 40000 -> 8000
    for the gate budget after checking convergence: sigma at nit = 8000, 20000 and 40000 agrees to all
    four printed digits (2.2 s vs 10.8 s).'
