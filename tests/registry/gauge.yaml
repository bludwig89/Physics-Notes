  control:
  - params:
      n_probe: 4
    reds:
    - S3
    reason: probe an EVEN colour count. A 4-quark colour-4 "baryon" has 4 constituents, which the block-swap
      parity predicts bosonic, contradicting the observed fact that real baryons (protons, neutrons) are
      fermions. Shows the oddness requirement genuinely discriminates rather than being vacuously true
      for every N.
  - params:
      n_probe: 1
    reds:
    - S4
    reason: probe the excluded case itself. dim su(1) = 0 exactly -- no gauge boson is even possible --
      so a theory with N=1 has no connection to confine with, inconsistent with quarks being observed
      confined (never free). This is the leg that actually excludes N=1.
  - params:
      bosonic_baryon: true
    reds:
    - S3
    reason: treat the composite exchange as bosonic regardless of constituent count, i.e. ignore that
      quarks are themselves fermions. S3 goes red AT EVERY N INCLUDING N=3 -- without fermionic valence
      quarks nothing ever predicts a fermionic baryon, at any colour count, which is what shows S2's fermion-specific
      sign (not group theory alone) is doing the work in S3.
  - params:
      partial_generator_check: true
    reds:
    - S1
    reason: check invariance under only the FIRST generator of su(N) instead of the full algebra. Several
      off-diagonal (N,k) cells acquire spurious "singlets" (states invariant under that one generator
      but not the whole group) -- e.g. (N=4,k=2) goes from singlet_dim 0 to 2 -- showing the "iff k=N"
      result depends on the FULL joint kernel, not a partial one.
  notes: 'Completeness row B1. Does NOT re-derive N_c=3 (F317 S6 / F318 SD / F324''s own business, row
    B10) and does not re-attack F317''s four closed legs. Narrows F324''s own named residual ("the index
    exists by fiat", SS10 item 1) to two named observational facts -- baryons are fermions; quarks are
    confined (no free fractional charge ever observed) -- combined with a genuine two-parameter generalisation
    of F317 S6''s fixed-k=3 Lambda^3 scan (S1: SU(N)-invariant subspace of Lambda^k(C^N) is 1-dim iff
    k=N, scanned over N=1..6, k=1..4) and an explicitly computed (not quoted) composite-fermion exchange-parity
    rule (S2: block-swap signature = (-1)^k for k=1..6). Combining "a quark-only colour-N baryon has k=N
    constituents" (S1) with "such a composite is a fermion iff N odd" (S2) against the observed fact that
    real baryons are fermions forces N odd (S3); combining dim su(N)>0 iff N>=2 against quarks being observed
    confined (never free, S4) excludes N=1. N odd and N>=2 gives {3,5,7,9,11} over N=1..12 (S5) -- matching
