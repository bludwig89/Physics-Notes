  control:
  - params:
      n_generations: 2
    reds:
    - W2
    - W2b
    - W3b
    - B1
    reason: break premise (i), n_gen odd. At n_gen = 2 the doublet count D = n_gen(N_c + 1) is even for
      every N_c, so the Z_2 parity stops selecting and the bracket returns {2,3} instead of {3}. This
      control prices how much of B10 now rests on rubric row C1, which is the transfer of debt F324 section
      10 asks a completeness sweep to record. G0, W1, Y1, W4 and the whole C7 side stay green on purpose,
      because none of them reads the generation count.
  - params:
      include_lepton_doublet: false
    reds:
    - W1
    - W2
    - B1
    reason: break premise (v), one colour-singlet lepton doublet per generation. Without it D = n_gen
      * N_c and the parity INVERTS, selecting even N_c and returning {2}. The conclusion does not merely
      weaken, it reverses, which is the sharpest available statement of how much work the assumed multiplet
      content is doing. W2b stays green because the constraint is still non-vacuous, just pointed the
      other way.
  - params:
      vector_like_su2: true
    reds:
    - W1
    - W2
    - W2b
    - B1
    reason: pair every left-handed doublet with a right-handed one. D doubles, every N_c passes, and the
      mod-2 obstruction is vacuous, which is what W2b measures. This is the control that makes F27's derived
      chirality load-bearing for the colour COUNT, the same dependency F317 section 5 found from the other
      side for colour's tracelessness.
  - params:
      quark_colour_rep: adjoint
    reds:
    - W1
    - W2
    - B1
    reason: break premise (iv), quarks in the defining rep with multiplicity N_c. In the adjoint the multiplicity
      is N_c^2 - 1 and the bracket returns {2}. This refutes any reading of section 2.1 as "the lower
      constraint consumes no colour input" - it consumes premise (iv) and the bit's sign is a function
      of it. What it does NOT consume is the epsilon-singlet index count, which is why F324 and F298 can
      be paired without double-counting.
  - params:
      c7_n_max: 3
    reds:
    - U1
    reason: F298's own idiom - a scan that never tests N >= 4 cannot claim to have excluded it. The support
      is still {2,3} but it is no longer measured as an upper edge, so the leg asserting the scan reached
      past the claim goes red. B1 stays green because the intersection is unchanged; the defect is in
      the evidence, not in the answer, and separating those is the point.
  - params:
      scan_from: 2
    reds:
    - U1
    - U1b
    - B1
