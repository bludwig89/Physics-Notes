- id: F26b-spin-axis-scalar-contamination
  kind: assertion
  tier: gate
  sector: gauge
  findings:
  - F26b
  - F24
  module: casim.engine.gauge.bilinear
  entry: check_spin_axis_scalar_contamination
  params:
    k_mag: 0.3
    n_dirs: 12
    seed: 7
  expect:
    exactness: machine
    tol: 1.0e-12
  control:
  - params:
      axis_control: true
    reds:
    - algebraic_identity
    - eigensolver_identity
    - f24_mean_reproduced
    reason: 'swap n_hat_y for n_hat_x in the identity. The contamination is NOT isotropic in the spin
      axis - y is picked out by the Bisio BCC walk''s intrinsic chirality convention (the continuum limit
      is n_hat -> (k_x, -k_y, k_z)/|k|), so the two identity legs and the mean must go red while spin-momentum
      locking and the continuum leg, which never mention y, stay green. MEASURED: alg 2.84e-14 -> 6.5e-01,
      eig 6.20e-14 -> 6.5e-01, mean 0.6898 vs a different closed form.'
  summary: 'F26b - the (1,0)-bilinear scalar contamination is closed form: |psi^T psi|^2 = 1 - n_hat_y^2,
    with n_hat the BCC spin axis. Five legs: Track A algebraic (2.84e-14), Track B against np.linalg.eig
    (6.20e-14), spin-momentum locking (n_hat.sigma) psi_+ = +psi_+ at finite k (1.8e-14), the continuum
    sign flip on k_y (converges to 1.3e-05 flipped, stays 1.99 unflipped), and F24''s "typically ~0.67"
    reproduced as a DERIVED mean (0.6897826774 measured vs closed form, agreeing to 1.1e-14).'
  note: 'Written 2026-08-18 for completeness row H8. F26b was one of sixteen findings the index carried
    as `no test record`, and it was the harder kind: the two verification tracks it quotes were sitting
    in `weyl_spin_axis_scalar_contamination` (bilinear.py), a function with no assert, no caller, no test
    file and no registry record - the residuals 2.84e-14 / 6.20e-14 in the finding were produced once,
    by hand, on 2026-05-23, and nothing had re-read them since. The `Test tag: C9` the finding names does
    not resolve to anything in tests/. This record executes both tracks and adds three legs the finding
    states in prose and never checked: spin-momentum locking (the premise both tracks rest on), the y
    sign flip in the continuum limit (WHY the singled-out axis is y), and the F24 mean as a derived rather
    than empirical number. The two residuals reproduce the finding''s digits exactly.'
