- id: F317-su3-structure
  path: tests/findings/test_F317_su3_structure.py
  kind: assertion
  tier: gate
  sector: gauge
  module: casim.engine.gauge.derive_su3_structure
  entry: check_su3_structure
  params:
    n_colour: 3
    use_compensator: true
    chiral_colour: false
    rule_reads_colour: false
    drop_d_R: false
  expect:
    exactness: exact
  findings:
  - F317
  - F91
  - F27
  - F68
  - F279
  - F293
  - F298
  - F289
  - F43
  results:
  - test-results/F317_su3_structure.json
  control:
  - params:
      use_compensator: false
    reds:
    - S3c
    - S3d
    reason: drop the link variable's transformation law U_mu -> V(x) U_mu V^dag(x+mu). The covariance
      legs must go red -- a covariance test that passes WITHOUT the connection has not tested the forcing,
      and the whole of section 3 would be vacuous. This is the most important control in the record.
  - params:
      chiral_colour: true
    reds:
    - S2a
    reason: couple colour to one branch only. The branch-space coupling stops being a scalar, so "the
      gluon's even law is forced" becomes a statement rather than a tautology. Section 2.1's contrast
      leg quantifies what it would have cost -- 5.137e-3 branch split on the body diagonal.
  - params:
      rule_reads_colour: true
    reds:
    - S4b
    reason: let one Gell-Mann matrix into the rule. The index stops being internal and the commutant collapses
      9 -> 3, so U(3) is no longer the invariance group. This is falsifier 1, made to fire.
  - params:
      drop_d_R: true
    reds:
    - S5d
    - S5e
    reason: delete one right-handed colour triplet from the model's first-generation content. The cubic
      SU(N)^3 anomaly stops cancelling 2 - 2 (goes to 0.577) and the mixed SU(N)^2 U(1)_Y one stops vanishing
      in N_c (goes to 1 - N_c). Both are then statements about the CONTENT rather than identities.
  - params:
      n_colour: 4
    reds:
    - S6b
    reason: run the multiplicity leg at N = 4, where Lambda^3(C^4) has dimension 4 and NO singlet. The
      check is N-sensitive rather than generic.
  - params:
      n_colour: 2
    reds:
    - S1c
    - S5d
    - S6b
    reason: 'run the whole argument at N = 2. Three legs go red together and it is the cleanest single
      statement of the finding: at N = 2 colour COULD have been chiral (A^{abc} vanishes identically,
      so all three assignments are consistent), the cubic cancellation is vacuous because A(fund) = 0,
      and there is no three-constituent singlet at all.'
  notes: 'Completeness row B1, colour leg ("colour is still put in"). 21 checks, 2.2 s. SU(3)_c is NOT
    derived from nothing and the record does not claim it is: the existence of the internal index is an
    INPUT and the finding leads with that. What is derived is that everything downstream of the index
    is not an independent choice. UNITARY (S4): the commutant of the model''s own two steps on the internal
    factor is COMPUTED at dim 9 = M_3, with the guard that those steps generate the full M_4 on the Dirac
    factor (16) and that the re-typed BCC walk is unitary at 2.2e-16 -- the guard the F313 review found
    missing in check_C4b. SPECIAL (S5): [SU(2)_L]^2 U(1)_trace = N_c b / 2 != 0 on the model''s OWN F279/F293
    nullspace, while the same row gives identically 0 for Y -- so F27''s chirality is what removes the
    U(1) from U(3). LOCAL (S3): a CA rule has no global operations, so the on-site step commutes with
    a SITE-DEPENDENT V(x) at 7e-16 while the hop fails at 1.343 and is repaired to 6e-16 by the compensator
    -- run both on a minimal ring and on the tree''s own strong.py operators. VECTOR-LIKE (S1/S2): a chiral
    triplet carries A^{888} = -1/sqrt(3) exactly while ALL 27 su(2) coefficients are exactly zero, so
    exactly one of {vector-like, chiral, conjugate} is anomaly-free. That CLOSES F91''s one unforced assignment
    -- F91 recorded colour vector-like "by construction" and the BCC gluon''s even law as unforced, selected
    by "the elegant-design philosophy". MULTIPLICITY (S6): Lambda^3(C^N) carries a singlet at exactly
    one N and it is 3, so three-constituent baryons + DERIVED Fermi statistics (F289) give N_c = 3 --
    consuming ONE empirical input, labelled, and agreeing with F298''s independent structural N_c <= 3.
    S6 is NOT one of B10''s three closed routes (anomaly / spatial-3 / Z_3) and does not re-open them.
    Six declared controls, each verified red and red only where declared. Prior art is stated in finding
    section 8: three of the seven legs are textbook group theory and the finding claims no new mathematics,
    only that the model''s six colour impositions reduce to one.'
  evidence:
    pytest_funcs: false
    has_assert: true
    has_main: true
    lines: 92
    n_test_funcs: 0
    artifacts_written: []
    artifact_rule: {}
    artifacts_read_only: []
    summary: F317 — the STRUCTURE of the colour gauge field (completeness row B1, colour leg).
- id: F320-gauge-boson-masses
  path: tests/findings/test_F320_gauge_boson_masses.py
  kind: assertion
  tier: gate
  sector: gauge
  module: casim.engine.gauge.derive_gauge_boson_masses
  entry: check_gauge_boson_masses
  params:
    equal_stiffness: true
    rank_two_breaking: false
    eliminate_u: true
  expect:
    exactness: bracketed
  findings:
  - F320
  - F141
  - F138
  - F231
  - F49
  - F51
  - F41
  - F27
  - F119
  - F127
  results:
  - test-results/F320_gauge_boson_masses.json
  control:
  - params:
      equal_stiffness: false
    reds:
    - B0a
    - B0b
    - B0c
    - B2a
    - B2b
    - B2c
    - B3b
    - B3c
    - B4b
    - B4c
    - B4d
    - B5a
    - B5b
    - B5c
    reason: break F141's (U1) equality between the 4 body-diagonal and 3 face facet axes, so the axis
      count is 4*2+3 = 11 instead of 7. Every leg that descends from the 7:2 counting must go red. What
      must STAY green is the rho block (B1a-B1d) and the Delta_r-invariance theorem (B4a) -- rho comes
      from the RANK of the breaking and B4a from the structure of the on-shell relation, and neither knows
      what the counts are. This control is what establishes that separation rather than asserting it.
  - params:
      rank_two_breaking: true
    reds:
    - B1a
    - B1b
    - B1c
    reason: give the abelian direction an independent second condensate direction, so the breaking is
      rank two. det M^2 stops vanishing, the photon acquires a mass and rho leaves 1 -- exactly the three
      legs, and nothing else. This is the control that makes rho = 1 from rank rather than from custodial
      SU(2) a measurement instead of a slogan. B1d stays green on purpose -- it tests the massless DIRECTION
      implied by the counts, which is a statement about g'/g and survives the rank change.
  - params:
      eliminate_u: false
    reds:
    - B2a
    - B2b
    - B2c
    - B3a
    reason: leave F141's stiffness quantum u free instead of eliminating it against e = g sin(theta_W).
      The determination g^2 = 18 pi alpha and both closed forms die, and so does the agreement between
      the closed form and the on-shell solve. B3b/B3c stay green because the on-shell solve reaches the
      tree masses through alpha directly rather than through u -- that is a real separation of the two
      routes, and writing the MEASURED red set rather than the expected one is what exposed it.
