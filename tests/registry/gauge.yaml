    (worst_rel_dev < 1e-10), showing the measurement can discriminate rather than always reporting "violated".
    domain_choice_divergence then tests the natural remedy this raises directly: if the WS restriction
    is dropping genuine vertex contributions, integrating over the FULL cube instead should improve b0_recovery''s
