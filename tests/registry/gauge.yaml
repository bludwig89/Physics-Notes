- id: F24-sl2c-covariance-full
  kind: assertion
  tier: gate
  sector: gauge
  findings:
  - F24
  module: casim.engine.gauge.bilinear
  entry: sl2c_covariance_full
  params:
    n_draws: 2000
    zeta_scale: 2.0
    seed: 24
  expect:
    exactness: machine
    tol: 1.0e-10
  results:
  - test-results/F24_sl2c_covariance_full.json
  notes: 'path dropped 2026-08-08: this record declared BOTH a pytest file and an `entry:`, so conftest.pytest_ignore_collect
    hid the file and its test functions never ran anywhere -- the ambiguity tests/casim/test_registry_entries.py
    refuses. Dropping `entry:` instead was wrong: a gate-tier record whose path sits outside tests/casim/
    MUST be entry-driven or test_registry_integrity''s `bare pytest == the gate tier` equality breaks.
    So the gate contract stays here as a registry-only record (the shape F20-wavepacket-group-velocity,
    F301 and F314-photon-packet-propagation already use), and tools/gen_test_registry.py scaffolds a separate
    battery record for the file, whose own test functions now run.'
  note: 'F24 remediation (review 2026-08-04, verdict CONFIRMED-NARROWER). The original check ran PURE
    BOOSTS ONLY. A pure boost A = cosh - sinh(sigma.v) is HERMITIAN, so A^dagger = A and the sandwich
    A^dagger sigmabar^mu A cannot distinguish A from A^dagger -- i.e. the single most likely implementation
    error (transpose where a dagger belongs) sits in the branch the test never exercised. This record
    adds the ROTATION branch (R = exp(-i theta/2 sigma.n) is unitary, so R^dagger = R^-1 and the placement
    finally matters; worst rel 5.9e-16) and BOOST-COMPOSED-WITH- ROTATION (worst rel 4.2e-14) -- a homomorphism
    checked only on two separate one-parameter subgroups has not been checked as a homomorphism. It also
    replaces a benign 12-draw sample with a worst case over 2000 draws. The residual here is limited by
    CONDITIONING, not eps: the single-Weyl current is null (measured nullity 8.7e-16), so an anti-aligned
    boost makes j^0 a near-total cancellation and the relative error grows like e^{2 zeta} eps -- worst
    rel 1.1e-13 at zeta = -6.9, three orders above the 3.71e-16 the finding called "the IEEE-754 double-precision
    floor". The tolerance 1e-10 is pre-registered from that growth law, not read off the residual, and
    `legacy_sample_is_optimistic` ASSERTS the worst case exceeds the legacy number by >100x so the claim
    cannot drift back. NOTE the identity itself is true by construction -- H -> A H A^dagger on rank-1
    Hermitian psi psi^dagger IS the definition of the SL(2,C) -> SO(1,3) covering map -- so this is a
    convention/regression record, not a physics result, and the finding now says so.'
