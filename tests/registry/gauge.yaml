- id: gauge-bcc-mc-d4
  path: tests/findings/test_bcc_gauge_mc_d4.py
  kind: assertion
  tier: gate
  sector: gauge
  module: casim.engine.gauge.bcc_action
  entry: check_bcc_gauge_mc
  params:
    L: 4
    Lt: 4
    N: 2
    beta_s: 1.7
    beta_t: 1.7
    include_mixed: true
    skip_checkerboard: false
    bad_reverse_shift: false
    hypercubic_anisotropy: false
    unsymmetrised_reps: false
    iso_L: 8
    iso_g: 0.004
  expect:
    exactness: machine
  findings:
  - F265
  - F94
  - F291
  - F313
  - F323
  - F299
  - F298
  results:
  - test-results/bcc_gauge_mc_d4.json
  control:
  - params:
      include_mixed: false
    reds:
    - S1a
    - S1b
    - O1a
    reason: 'The staple drops the 4 mixed space-time rectangles while the action keeps them, so it stops
      being dS/dU. S1a/S1b are the bond-counting identity sum_links Re tr(U A) == 4 sum_loops beta Re
      tr P and must fail at O(1); the RIGHT-HAND SIDE of that identity deliberately keeps the full action,
      because dropping the mixed loops there too would make the control self-consistent and green, which
      is the V-004 defect class. O1a spills and is DECLARED rather than excluded: over-relaxation is microcanonical
      only with respect to the action its staple is the derivative of, so an incomplete staple provably
      cannot preserve the full S. Measured, not expected.'
  - params:
      skip_checkerboard: true
    reds:
    - O1a
    reason: 'One colour class instead of four, so a staple is reused for links that DO share a plaquette.
      This is the single-legged control: everything algebraic about the construction is unchanged and
      only the microcanonical identity can see it, which is exactly what the checkerboard exists to protect.
      The bipartition being tested is a property of the BCC graph, not a convention -- a rhombus with
      sides {a, e} carries two a-bonds stored one hop apart, and the nearest-neighbour graph is bipartite,
      so leg B1b is the theorem and O1a is its consequence.'
  - params:
      bad_reverse_shift: true
    reds:
    - G1a
    - S1a
    - S1b
    - W1a
    reason: 'Drops the "- d" of U_{-d}(x) = U_d(x - d)^dag, i.e. the realistic off-by-one-hop bug. Nothing
      leaves SU(N) -- the stored fields are untouched and a product of unitaries is unitary -- so H1a
      and H1b CANNOT detect it, which is the reason gauge invariance is in this record at all. G1b stays
      GREEN and that is measured rather than expected: `_transporter` builds R x T loops from forward
      hops only and daggers whole legs, so the Wilson-loop path never reaches the corrupted branch. The
      same asymmetry is why W1a reddens -- the action''s mixed rectangle is corrupted while the loop is
      not, so the two objects that leg asserts are identical stop agreeing.'
  - params:
      hypercubic_anisotropy: true
    reds:
    - X1c
    - X1d
    reason: 'Predict the TEXTBOOK hypercubic beta_t/beta_s = xi^2 instead of the BCC 4 lambda^2/a_t^2
      = (4/3) xi^2. The measured weak-field ratio is unchanged at 4, so the prediction misses it by exactly
      the 4/3 this derivation supplies -- i.e. the control IS the new content, and the leg it reddens
      is the one that measured rather than assumed. Note what is NOT a control here: c_lat cannot be perturbed
      to redden anything, because changing it moves a_t and the prediction together (the derivation is
      self-consistent at any c_lat). The falsifiable content is the relation beta_t/beta_s = 4 lambda^2/a_t^2,
      and this is the control that tests it.'
  - params:
      unsymmetrised_reps: true
    reds:
    - K1a
    reason: 'Build the higher reps as the raw tensor power, chi = (Tr W)^k, instead of projecting onto
      the symmetric subspace. This is the realistic mistake and it is precisely why the explicit-matrix
      cross-check exists: F299''s polynomials had only ever been checked against the Jacobi-Trudi determinant
      that produced them, which cannot catch a wrong SYMMETRISATION because both sides would carry it.
      Single-legged -- K1b''s dimension count is deliberately left green, since forgetting to symmetrise
      does not change the dimension of the matrix you built.'
  evidence:
    mentions:
    - F94
    - F265
    - F291
    - F313
    pytest_funcs: false
    has_assert: true
    has_main: true
    lines: 143
    n_test_funcs: 0
    artifacts_written:
    - test-results/bcc_gauge_mc_d4.json
    artifact_rule:
      test-results/bcc_gauge_mc_d4.json: local
    artifacts_read_only: []
