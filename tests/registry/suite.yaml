version: 1
sector: suite
about: 'Roadmap C7.1, decision D9. One declarative record per test file: what it runs, at what parameters,
  and how it fails. `casim test` and `pytest` both execute THESE records (src/casim/tests/), so they cannot
  diverge. AUTO-SCAFFOLDED by tools/gen_test_registry.py: the `evidence:` block is generated and rewritten
  on every run; every other field is human-owned and preserved. Promote a record off `legacy_script` by
  adding `module:`/`entry:` (+ `params:`/`expect:`) — that is the C7.4/C7.5 work, and regeneration will
  not undo it. `findings:` is HUMAN-OWNED and means one thing: if that finding is false, THIS RECORD GOES
  RED. It is not "this test is about that finding" — the F-numbers a file merely names are generated into
  `evidence.mentions`, which is an index and not a coverage claim. Falsification-brief ids (FA*/FB*/FC*,
  tests/falsification/) and first-generation tags (FG*) are a different id space and do not belong in
  `findings:`; they have their own `briefs:` field. Measure what is owed with tools/audit_finding_coverage.py.'
