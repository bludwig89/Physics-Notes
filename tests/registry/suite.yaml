- id: control-soundness
  path: tests/casim/test_control_soundness.py
  kind: assertion
  tier: gate
  sector: suite
  control:
  - test: test_a_noop_perturbation_is_reported_as_leak
    reason: the weak form, used deliberately and as its own demonstration. A checker that scored an inert
      perturbation as sound would make every CONTROL verdict in the journal worthless, so the machinery's
      own negative control is the one test whose failure invalidates the layer. Weak because this record
      delegates to pytest and has no entry to inject into (C7.4).
  notes: 'Gap #3 of docs/status/completeness-2026-08-07.md, rubric row H2: check soundness as a gate.
    Covers the `control:` schema in casim.tests.registry (shape validation, strength vocabulary, the gate-tier
    assertion scope, Fraction-preserving param coercion) and its execution in casim.tests.runner (run_control,
    leg_map over the three payload shapes in use, record_fingerprint). THE LOAD-BEARING TEST IS test_a_noop_perturbation_is_reported_as_leak:
    _synthetic_check accepts a switch that changes nothing, and the checker must report LEAK rather than
    CONTROL. LEAK / SPILL / INVALID are asserted apart on purpose -- collapsing any pair would let the
    easy failure absorb the hard one, which is the A10 over-grade this report corrected by hand. No physics;
    this is the instrument.'
  evidence:
    mentions:
    - F22
    - F298
    - F303
    pytest_funcs: true
    has_assert: true
    has_main: false
    lines: 414
    n_test_funcs: 29
    artifacts_written: []
    artifact_rule: {}
    artifacts_read_only: []
    summary: The negative-control machinery, and a negative control for it (D9, row H2).
  findings:
