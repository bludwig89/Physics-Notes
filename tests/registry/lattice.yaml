- id: F20-bcc-onaxis-dispersion-exact
  kind: assertion
  tier: gate
  sector: lattice
  findings:
  - F20
  - F26
  module: casim.engine.lattice.wavepacket
  entry: check_group_velocity_closed_forms
  params:
    k0: 0.8
    m: 0.3
    n_k: 500
  expect:
    exactness: exact
    tol: 0
  notes: 'path dropped 2026-08-08: this record declared BOTH a pytest file and an `entry:`, so conftest.pytest_ignore_collect
    hid the file and its test functions never ran anywhere -- the ambiguity tests/casim/test_registry_entries.py
    refuses. Dropping `entry:` instead was wrong: a gate-tier record whose path sits outside tests/casim/
    MUST be entry-driven or test_registry_integrity''s `bare pytest == the gate tier` equality breaks.
    So the gate contract stays here as a registry-only record (the shape F20-wavepacket-group-velocity,
    F301 and F314-photon-packet-propagation already use), and tools/gen_test_registry.py scaffolds a separate
    battery record for the file, whose own test functions now run.'
  note: 'F20 remediation (review 2026-08-03, verdict OVERSTATED). The exact result the finding stated
    in prose and never guarded: along a coordinate axis the two transverse cosines are 1.0 and the two
    transverse sines are 0.0, both representable, so u^+-(k x_hat) = cos(k*c_lat) holds BIT-FOR-BIT and
    omega = k*c_lat is an algebraic identity rather than a small-k limit -- the on-axis cone has exactly
    zero curvature. Asserted at tolerance 0 on both branches. It is not a tautology: `offaxis_control_nonzero`
    requires the same residual along the body diagonal to be O(1) (measured 1.954), which is what gives
    the exact check a direction and a failure mode. The two closed-form group velocities dw/dk_x = c_lat*n_hat_x
    (massless) and c_lat*n_kin*n_x/sqrt(1-n_kin^2 u^2) (Dirac) are checked against central differences
    of the analytic dispersion at 30 random off-axis k, residual ~5e-11 = the h^2 floor. The omega-level
    residual is bounded by arccos_amplification_bound = 2*eps/sin(pi/(n_k-1)), derived from the conditioning
    of arccos and from n_k alone -- pre-registered, not read off the residual.'
- id: F20-wavepacket-group-velocity
  kind: assertion
  tier: gate
  sector: lattice
  findings:
  - F20
  module: casim.engine.lattice.wavepacket
  entry: check_packet_velocity
  params:
    m: 0.3
    seed: branch-pure
    n_steps: 44
    tol: 1.0e-12
  expect:
    exactness: machine
    tol: 1.0e-12
  results:
  - test-results/F20_wavepacket_group_velocity.json
  note: 'F20 remediation. Replaces the demonstration-grade number with a gate. Two things had to change
    together. (1) WRAP-FREE: the original ran a 64^3 periodic box in which the packet wraps within 44
    ticks; the box scan is monotone and reaches 1.024*c_lat -- superluminal -- at L_x=192, which by itself
    proves the fitted slope is not a group velocity there. The record asserts edge_weight <= 1e-12, i.e.
    the envelope never reaches a boundary. (2) THE RIGHT TARGET: a branch-pure (positive-energy-projected)
    seed carries no +-branch beat, so the centroid drift is an exact Ehrenfest statement and equals <dw/dk_x>
    to float64 round-off -- measured rel 6.0e-16 at m=0.3 and 3.8e-15 at m=0.5, against the original finding''s
    1.06%. The tolerance is the repo machine class and is pre-registered, not fitted. Real failure mode:
    perturbing m moves measurement and prediction together (m=0.3 -> 0.4654257818, m=0.5 -> 0.3485063259),
    and the fixed-spinor variant (seed=fixed, massless) relaxes instead to c_lat*<n_hat_x^2> -- 1.98x
    the tilt-only deficit, which is the factor of two the finding''s stated mechanism was missing.'
