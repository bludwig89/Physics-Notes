    dispersive commuting flow V = I_branch (x) A on the FREE massive Dirac walk and labelled its reading
    a reading. This record settles it, in the STRONG form: an interacting theory can carry a DEFORMED
    conserved charge (that is what integrability is), so C5 asks not only whether V survives but whether
    any O(G) deformation of it does. Homogeneous antisymmetrised two-particle sector at fixed total momentum
    -- nothing breaks translation invariance by hand, so a symmetry that fails cannot blame the setup.
    Since Gamma(V) commutes with Gamma(D) exactly, [Gamma(V),U] = Gamma(D)[Gamma(V),exp(-i H_int)], so
    the reduction to "H_int must connect only states of equal q_V mod 2pi" is an IDENTITY, not an approximation.
    Verdict: V is broken maximally (max|dphi_V| = 3.113, i.e. ~pi) by both the contact kernel (Hubbard/NJL,
    F217/F77) and photon exchange (F68, 1/q^2), and 1340 RESONANT elements -- where the O(G) denominator
    dOmega vanishes -- carry dphi_V up to 2.876, so no deformed V is conserved at leading order. C2 is
    the leg that makes this mean anything: an INTEGRABLE mode-diagonal interaction gives 0 obstructed,
    so the test can report survival. C6 is its partner: on the same resonant set the EVOLUTION''s own
    charge is conserved to 1.8e-15. C10 records a PREDICTION OF THE SESSION THAT WAS WRONG -- the <100>
    line was expected to go blind (on-axis dispersion exactly linear, residual 9.3e-15) and does not,
