- id: F316-laurent-pell
  path: tests/findings/test_F316_laurent_pell.py
  kind: assertion
  tier: gate
  sector: lattice
  findings:
  - F291
  - F313
  - F316
  module: tests.findings.test_F316_laurent_pell
  entry: check_all
  params: {}
  expect:
    exactness: machine
    tol: 1.0e-09
  note: 'Closes F313''s LAST import and CL269''s only remaining contingency. F313 sec.6 cited Dubickas-Steuding
    Thm 2 (originally, and wrongly, Abel 1826); D-S is proved over k[x] and its descent needs "deg f =
    0 => f constant", which is FALSE in a Laurent ring -- deg(1 + w1^-1) = 0 yet 1 + w1^-1 is not a unit,
    the units of R being exactly the monomials. This record verifies the in-repo replacement: a two-sided
    width D(f) = h_f(lambda) + h_f(-lambda) from the Newton polytope, additive under multiplication (C1)
    and vanishing EXACTLY on units (C2, asserted on that very counterexample); plus the ingredient D-S
    neither has nor needs, that UNITARITY (not det = 1) forces a* = a and b* = -b and hence centrally
    symmetric Newton polytopes (C3). The descent then follows: h_a = h_b + c (C4); lc(a) = +-i lc(b) lc(u)
    so exactly one of b*u +- a*i cancels at the top (C5); the product of the two candidates equals 1 +
    b^2 exactly, with D(1+b^2) <= 2 D(b) (C6); hence D drops by exactly 2c per step (C7), landing on {+-1,
    +-A^+-1} because u has EIGHT monomials and so is not a difference of two (C8). C9 asserts the D(b)
    > 0 hypothesis is load-bearing -- at the base case 1 + b^2 = 0 and C6 degenerates, which the first
    run of this work hit for real. C10 re-runs the verdict under a second unrelated lambda, without which
    the proof could be an artifact of one direction. The test re-implements width, leading coefficient
    and descent from the definitions against a DIFFERENT lambda than the module uses. SCOPE, stated: this
    N under unitarity -- NOT a re-proof of D-S in several variables.

    '
  control:
  - params:
      degenerate_lambda: true
    reason: 'lambda = (0, 1, sqrt2) is BLIND to w1, so the eight cube corners collapse to four doubled
      values (maximiser not unique) and 1 + w1^-1 acquires width 0 while remaining a non-unit -- precisely
      the (*) failure mode the proof exists to avoid. C1/C2 must go red. WORTH RECORDING: the first draft
      used lambda = (1,2,3), Q-DEPENDENT but still separating these supports, and it LEAKED green. Blindness,
      not irrationality, is the real hypothesis, and the leak is what showed it. VERIFIED RED 2026-08-13.

      '
  - params:
      nmax: 1
    reason: 'the F298 idiom: at nmax = 1 only the base case is in range, so there is no descent step to
      exercise and C6/C7 have no content. Must go red rather than pass vacuously. VERIFIED RED 2026-08-13.

      '
  - params:
      drop_unitarity: true
    reason: 'multiplies b by a monomial, destroying b* = -b -- i.e. central symmetry of the Newton polytope
      -- while leaving every element a perfectly good member of R. C3 must go red. This is L3, the one
      ingredient the polynomial proof has no analogue of, and the control shows the descent genuinely
      needs unitarity, not merely det = 1. VERIFIED RED 2026-08-13.

      '
  evidence:
    mentions:
    - F298
    - F313
    - F316
    pytest_funcs: false
    has_assert: true
    has_main: true
    lines: 399
