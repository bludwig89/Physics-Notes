  results:
  - test-results/F313_time_signature.json
  note: 'The "+1" (completeness-2026-08-07 rubric row A1, the residual F291/F292 left). F291 sec.6 asserts
    that any second commuting flow would be a further Cayley-graph generator; sec.7 names the price of
    proving it. This record COMPUTES the split instead: the commutant of the BCC update inside the local
    homogeneous unitaries is 2-dimensional (C1b) and free of rank one because gcd(n~) is a unit (C2),
    det splits it into exactly the shift lattice U(1) x Z^3 -- monomials only, which is the direction
    F291 assumed (C3b) -- and the Pell group of R[sqrt(1-u^2)], whose discriminant is squarefree (C4a)
    and whose fundamental unit is the update itself with deg b = 0 (C4b). Tower, descent and infinite
    order are exercised (C5a-c). d_time = rank su(2) = 1 from the SAME s = 2 that gives F291 d_space <=
    dim su(2) = 3, so A1''s two halves have one premise (C6). The Bloch vector is re-typed from qca-papers-1-4-overview.md
    Eq. 15 rather than imported, and C5a cross-checks the module''s hand-rolled Laurent ring against sympy''s
    Chebyshev recurrence. IMPORTED: Abel''s theorem (the Pell group of a quadratic extension is cyclic)
    -- hypotheses verified here, conclusion not re-proved, flagged in the finding, CL269 and the exactness
    inventory. C7 is the machine leg and the named residual: a free s = 4 Dirac cell DOES carry a second
    dispersive commuting flow V = I (x) A at every mass.

    '
  control:
  - params:
      pell_nmax: 1
    reason: 'the F298 pattern: a tower that does not climb cannot evidence a rank-one group. At height
      1 there is no descent to exercise and no second power to compare, so C5a/C5b/C5c are vacuous. No
      `reds:` -- this driver asserts rather than emitting a `checks` list, so the claim is the verdict
      flip. VERIFIED RED 2026-08-12, re-verified 2026-08-13.'
  - params:
      cell_dim: 4
    reason: 'what makes d_time ONE is that the model''s cell is s = 2 (BDPT minimality, founding decision
      6 -- the same input F291 S1 uses), NOT an arithmetic identity in s. REWRITTEN 2026-08-13: the review
      found this control reddened only C1a, in 0.03 s, and that the leg which flipped was the test asserting
      its own input; C6 never ran. CHECKS now runs C6 second, so the control reaches both, and the module
      REFUSES any cell but s = 2 rather than extrapolating d_time = s - 1 (withdrawn as numerology). C6
      converts that refusal into a clean AssertionError so the control scores CONTROL and not INVALID.
      VERIFIED RED 2026-08-13.'
  - params:
      fake_gcd: true
