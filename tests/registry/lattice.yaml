- id: F278-bcc-lattice-constant
  kind: assertion
  tier: gate
  sector: lattice
  module: casim.engine.lattice.bcc
  entry: check_lattice_constant_identities
  expect:
    exactness: exact
    tol: 0
  findings:
  - F267
  - F273
  - F278
  summary: 'F278 — the BCC walk''s conventional cube edge is a = 2/sqrt3 = 2*c_lat. Nine checks: five
    symbolic (sympy, residual identically zero), one IEEE-754 bit compare against 0x3fe279a74590331d,
    one at 1 ulp, and two float evaluations of the shipped bcc_dispersion at Gamma-H. Promotes F267''s
    measured cube/BZ ratio 4/(3 sqrt3) to the primitive-cell volume a^3/2 and F273''s measured "sqrt3
    . fcc" period to the reciprocal lattice 4 pi / a. Real failure mode: any change to c_lat, to the hop-phase
    convention in bcc_fractional_shift, or to _bcc_uvec breaks check 2, 6 or 9 — which is what audit item
    V-016 found nothing guarding. The record F278 section 9 specified and did not add; written 2026-08-03
    by gap #5 of the 2026-08-02 completeness sweep. Corrects F278 check 8, tabulated as float 0.0: 1/c_lat
    is one ulp below sqrt(3), so the float residual is 8.88e-16, exactly one ulp. The identity itself
    is exact (check 7, sympy).

    '
- id: F291-dimension-selectors
  path: tests/findings/test_F291_dimension_selectors.py
  kind: assertion
  tier: gate
  sector: lattice
  findings:
  - F26
  - F27
  - F69
  - F91
  - F291
  module: tests.findings.test_F291_dimension_selectors
  entry: check_all
  params: {}
  expect:
    exactness: exact
    tol: 1.0e-09
  results:
  - test-results/F291_dimension_selectors.json
  note: 'Spacetime dimensionality (completeness-2026-08-02 rubric row A1, the first ABSENT entry). Three
    selectors, re-derived with sympy independently of the module: S1, ker(J)=0 only for d<=3 because the
    Bloch vector is valued in R^3; S2, coker(J)=3-d, so an isotropy-invariant intra-branch mass exists
    at d=1,2 and not at d=3, which is what leaves the F27 phase to gauge; S3, d(d-1)/2=d has integer roots
    {0,3} and the Hodge condition d-2=1 closes the d=7 loophole. (S1 and S2) and (S3) each give {3} alone.
    Corollary: det J exists only at d=3 and equals -/+ c_lat^3, so the two BDPT branches are the two orientations
    of a square map. D2 finite-differences the engine BCC walk (residual 3.2e-14), which is the tol=1e-9
    leg.

    '
  control:
  - params:
      cell_dim: 4
    reason: the internal vector space is 3-dimensional BECAUSE the cell is s = 2, not as an arithmetic
      identity. At s = 4 the module refuses to answer and A1 must go red. No `reds:` -- this driver asserts
      rather than emitting a `checks` list, so the claim is the verdict flip.
  - params:
      d_scan_max: 3
    reason: 'the F298 pattern: an UPPER bound at 3 is unevidenced unless the scan reaches d >= 4. Truncated
      to 3, `ker_zero_dimensions == [1,2,3]` is trivially true, which is the false pass the guard exists
      to make impossible.'
  evidence:
    mentions:
    - F291
    pytest_funcs: false
    has_assert: true
    has_main: true
    lines: 317
    n_test_funcs: 0
    artifacts_written: []
    artifact_rule: {}
    artifacts_read_only: []
