    reason: 'run with no internal factor at all. D1 goes red -- the three-constituent antisymmetric state
      does not exist -- while every space and time check stays GREEN, which is D3''s indifference made
      visible in a single run: the cell does not care, the matter sector does.'
  notes: 'F317''s residual ("THAT the quark carries an internal index at all"), and the attack F317 named
    for itself. 11 checks, 1.1 s. The residual is NOT closed and the record does not claim it is -- it
    is RESHAPED, because three questions were tangled inside it. PERMIT (sections B, C): free. F291 section
    3 flags its own weakest point -- "conditional on s = 2 ... a larger cell would relax this to d <=
    2k+1" -- and that is measured to be the WRONG bound: what S1 needs is the maximal ANTICOMMUTING subset
    of the HOP''s traceless span, and the model''s branch-doubled cell widens that span from 3 to 6 while
    leaving the rank at 3, because tau_3 x sigma_i COMMUTES with 1 x sigma_i. An internal factor changes
    neither number, on a cell of dimension 12. On the time side the commutant over generic momenta factorises
    exactly, 2 -> 18 at N = 3 (a factor N^2), which a naive reading of F313 would report as 2N - 1 = 5
    times; it does not, because every added element is NON-DISPERSIVE at literal 0.0 against the update''s
    0.2846. A commuting unitary is a clock only if it disperses -- a criterion F313 never had to state,
    and F313 section 9''s own second flow WAS dispersive, which is why F315 had to kill it. SHAPE (B4):
    forced -- a walk that genuinely uses five anticommuting generators on C^4 has ker J = coker J = 0
    at d = 5, so the selector returns 5 rather than 3, and enlargements are not all alike. FORCE (section
    D): NOT by the cell, which is measurably indifferent. The forcing is DERIVED Fermi statistics (F289):
    the antisymmetric subspace on one nodeless level has dimension C(2N, n), computed by explicit antisymmetrisation
    rather than from the formula, and it is 0 at N = 1 for n = 3 -- spin alone caps a nodeless level at
    TWO. Four declared controls, each verified red and red only where declared. Prior art is stated in
    finding section 5; no new mathematics is claimed. THE HONEST RESIDUAL: the number three is not derived,
    and F317 section 6 consumes the SAME three-constituent fact, so the two findings do not independently
    confirm each other.'
