    to: 15
    status: accepted
    reason: >-
      Findings 1-15 predate the one-file-per-finding convention and live
      together in `findings/F01-F15-findings.md`. Nothing is missing; the
      numbering is simply older than the layout. (This is also why the inventory
      cites "Finding 1", "Finding 7" rather than "F1", "F7".)

