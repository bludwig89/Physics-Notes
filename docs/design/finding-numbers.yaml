  status: accepted
  reason: Findings 1-14 predate the one-file-per-finding convention and live together in `findings/F01-F15-findings.md`.
    Nothing is missing; the numbering is simply older than the layout. (This is also why the inventory
    cites "Finding 1", "Finding 7" rather than "F1", "F7".) NARROWED 2026-08-03 from an upper bound of
    15, because 15 is no longer a gap - Finding 15 was promoted to `findings/F15-closed-form-lorentz-violation-coefficients.md`
    with a gate-tier registry record, per recommendation 1 of `docs/reviews/F01-F15-review-2026-08-03.md`.
    The remaining 2-14 are still bundle-only; five of them (1, 4, 5, 6, 14) are engineering records rather
    than physics findings, which is why promoting them is not automatically the right move.
