version: 2
updated: 2026-08-05 - 09:30
about: 'Declared exceptions for the C8.2 finding-number audit. Duplicates are numbers with two finding
  files; gaps are missing numbers between F1 and the maximum. Every entry needs a reason; `casim index
  --check` fails on an undeclared one. NINE of the ten duplicates were resolved on 2026-07-31 by suffixing
  one side with `b` — the suffix keeps the number findable, so existing citations still resolve, while
  making the files distinguishable to tooling. The `resolution:` field on each records which side moved
  and why. Entries are kept after resolution: a removed exception loses the history of what happened.


  REVISION 2, 2026-08-05 — this file changed ROLE. Under block reservation a gap was permanent: a
  session reserved 3-5 numbers, spent one, and the rest sat here forever as history. This file was
  therefore an archive, and it grew monotonically — 24 gap entries by 2026-08-04, seventeen of them
  interior. Numbers are now taken ONE AT A TIME at write time, lowest free first (CLAUDE.md
  "Concurrency"), which makes the gap list a WORK QUEUE that is supposed to shrink. Two consequences,
  both enforced:

  1. `status:` on a gap is now a closed vocabulary, and retakability is DECLARED, never inferred from
  "no file exists":

       free      Nobody ever wrote at this number and nothing cites it as taken. RETAKABLE — the
                 allocator (`casim index`, line NEXT FREE NUMBER) hands out the lowest of these, so
                 spending it CLOSES a gap instead of opening one. 22 numbers carry it today; that is
                 the backlog left by the old scheme, and it drains as findings land.
       resolved  Declared, cause understood, NOT retakable. Two sub-cases: the number is cited
                 elsewhere as abandoned (F219 and F229 — the changelog records a concurrent session
                 taking them, so a reader chasing that citation must not land on unrelated physics),
                 or the entry is the record of a gap that was CLOSED by recovering a file (111, 127,
                 285).
       retired   A file existed and was moved to `deprecated/findings/`. NOT retakable — the write-up
                 still exists, it is just no longer a live finding (16-19).

  2. A `status: free` entry naming a number that NOW HAS A FILE fails `casim index --check`.
  Deleting the entry IS the act of spending the number. This hazard did not exist under block
  reservation and is the one the new scheme creates: a spent number still advertising itself as
  available is exactly how two sessions get handed the same one. `resolved` and `retired` are exempt,
  for the same reason resolved duplicates are — they are the record OF the closure.'
