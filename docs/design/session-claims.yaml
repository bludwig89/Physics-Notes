version: 2
updated: 2026-08-05 - 22:25
about: |
  THE CLAIM BOARD. A claim advertises WHAT A SESSION IS WORKING ON and WHICH
  SECTOR IT OWNS. Since 2026-08-05 it does NOT allocate finding numbers.

  Why this file exists: finding-number and test-ID collisions between parallel
  sessions have happened at F110, F129, F219, F229-F232, F262, and during C1/C2
  and C5/C6. Every one of them had the same shape — two sessions each read the
  same "max finding number", each wrote the next one, and the loser found out
  afterwards. Reading the max is not a reservation.

  -- REVISION 2, 2026-08-05: reservations are gone ---------------------------

  The board was doing two jobs, and one of them it could not do well.

    Advertise topic + sector.  Must happen at SESSION START, because its whole
                               value is warning a parallel session off before
                               either has done the work.
    Allocate a finding number. Cannot be sized at session start, because nobody
                               knows at session start how many findings a
                               question will produce.

  Bundling them forced the second job onto the first job's clock, so every
  session guessed — and the guess was "3 to 5". The arithmetic is not subtle:
  most sessions land one finding, so most sessions abandoned 2-4 numbers. While
  the claim was open those were a clean TAIL and harmless; the moment a parallel
  session took a higher number they became an interior GAP, and the abandoning
  session was usually already gone. Seventeen interior gaps had accumulated
  between F291 and F314 by 2026-08-04 — 303-305, 307-310, 311-313 in three
  consecutive runs — and each one cost a hand-written declaration in
  docs/design/finding-numbers.yaml explaining a number nobody ever used.

  So the two jobs are split:

    1. AT SESSION START, open a claim here: session, sector, topic. NO NUMBERS.
       This is the collision-avoidance half, and it is unchanged in every other
       respect.
    2. AT THE MOMENT YOU WRITE `findings/F{N}-...md`, take exactly ONE number —
       the LOWEST FREE one, printed by `casim index` as NEXT FREE NUMBER — and
       add `{N}: findings/F{N}-...md` to your `used:` map in the SAME edit that
       creates the file. Need a second finding? Repeat, then.

  What this buys: an unspent reservation can no longer exist, because a number
  is only ever taken by the act of spending it. Reservation-induced gaps go to
  zero structurally, not by anyone being careful. And because the number taken
  is the lowest free one rather than max+1, the 22-number backlog the old scheme
  left behind DRAINS as ordinary work lands — see the `free` entries in
  docs/design/finding-numbers.yaml.

  What this costs, stated honestly: the window between reading NEXT FREE NUMBER
  and writing the file is no longer covered by a reservation. That window is now
  seconds instead of hours, and a race inside it produces a DUPLICATE, which
  `casim index` already refuses. The old scheme's window was the whole session
  and its failure mode was a silent gap, which nothing refused. Trading a loud
  rare failure for a quiet common one is the point.

  See CLAUDE.md "Concurrency" for the protocol. This file is the record; the
  protocol is the habit.

# ---------------------------------------------------------------------------
# THERE IS NO ALLOCATION POINTER HERE ANY MORE.
#
# `next_finding` was removed in revision 2. It pointed at max+1, which is the
# wrong number to hand out when 22 lower numbers are free, and keeping a second
# allocator in a second file is how a pointer and a reality disagree. The one
# allocator is now `casim index`, which computes the lowest number declared
# `status: free` in docs/design/finding-numbers.yaml and prints it as
# NEXT FREE NUMBER. Do not reintroduce a pointer here.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Schema for a claim
#
#   session:      the session handle (the sandbox's adjective-adjective-name).
#   opened:       yyyy-mm-dd - hh:mm
#   status:       open | released
#   sector:       one of core lattice gauge particles interactions forks numerics
#                 -- the MODULE sector vocabulary, same as the registries. Use
#                 `docs` for a documentation-only session.
#   topic:        one line. What question is being asked or what element is
#                 being built. Enough for another session to tell whether it is
#                 about to duplicate your work.
#   findings:     REMOVED in revision 2. A claim reserves no numbers. If you are
#                 reading an old entry, its `findings:` block is the historical
#                 reservation, kept because the board is also the collision
#                 history -- do not add the field to a new claim.
#   used:         the ONLY number field. number: filename, appended in the SAME
#                 EDIT that creates the finding file, one at a time. Take the
#                 lowest free number -- `casim index` prints it as NEXT FREE
#                 NUMBER -- and delete that number's `status: free` entry from
#                 docs/design/finding-numbers.yaml in the same edit, which is
#                 what marks it spent. A released claim with an empty `used` map
#                 now means exactly what it says: this session wrote no finding.
#                 Under revision 1 it also meant 3-5 numbers had just been
#                 stranded, which is the whole reason for the change.
#   tests:        registry IDs you will add to tests/registry/*.yaml. Claiming
#                 F<N> claims the `F<N>-*` test-ID namespace with it; list only
#                 IDs that do NOT derive from a claimed finding number
#                 (run-*, fork-*, scenario-*, and any F<N>-* on someone else's
#                 number).
#   files:        NEW non-finding files whose names could collide -- an overview
#                 in docs/status/, a roadmap, a new engine module. Not every
#                 file you touch; the ones another session might also invent.
#   released:     yyyy-mm-dd - hh:mm
#   release_note: what actually landed. Revision 2 deleted the second half of
#                 this field's old job -- there is no "reserved but not used"
#                 to report, because nothing was reserved. Say what was written
#                 and what was handed on.
#
# Released claims stay. The board is also the collision history; deleting a
# released claim deletes the evidence of who held a number and when.
# ---------------------------------------------------------------------------

