  `dead_symbols` is ACCEPTED-ONLY and starts empty: migrate_module.py strips it and never reads `dead_symbols_proposed`.'
field_notes:
  status:
    live: no ledger record, referenced — migrate as-is
    partial: the ledger names it but did not kill it. THE COMMON CASE. Needs a human to decide what, if
      anything, is dead inside it.
    dead_candidate: nothing imports it and it has no __main__
    fork_live: a fork something still references
    fork_unclaimed: a fork nothing references — a RECORDED NEGATIVE RESULT, not dead code. Migrates.
  reach:
    driven: in the transitive import closure of a module that registers a Channel (the headline; least
      flattering)
    entry-script: a derive_*/run_* script with a __main__ that nothing imports — meant to be RUN, not
      a defect
    note: Edges are `static` (an ast.Import) or `dynamic` (a string literal naming a module — how casim.fields.*
      shims work). np/scipy/fft site counts are REGEX, for C1/C2 sizing only.
    package-only: reachable from src/casim but not from any registered channel — CLI, suite, analysis,
      shims
    test-only: referenced only by tests
    unreferenced: nothing in the tree references it
  dead_symbols: accepted; stripped by migrate_module.py
  dead_symbols_proposed: advisory; never acted on
