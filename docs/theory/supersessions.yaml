  - id: S6-F253-weight-as-phase
    date: 2026-07-16
    kind: superseded
    by: [F253, F255, F256]
    superseded: [F179]
    scope: >
      Weight-as-phase is adopted as a FOUNDING PRINCIPLE: the charged-lepton
      condensate shape-angle equals the second-shell E_g representation weight,
      delta* = dim(E_g)/dim(T_1u x T_1u) = 2/9 rad. delta* is PRIMARY;
      lambda_6 = 0.243 (equivalently W = 6 lambda_6 = 1.46) is an OUTPUT via the
      F234 arrow, not a fit. Supersedes the F179/CN3 "lambda_6 not reducible /
      spectrum is a one-angle fit" relabel.
    reason: >
      Every alternative route is closed. (a) F175: 2/9 is the exact E_g weight.
      (b) F255: the angle is a genuine radian with R = 1 FORCED by Schur
      isotropy of the E_g irrep metric — derived, not posited. (c) F253: a
      scale-free topological origin is excluded (the only E_g holonomy on the
      BCC second shell is 2 pi/3). (d) F256: the dynamical Landau route
      provably cannot give exact 3 delta* = Q, because B (Dirac sea, F95) and
      C (induced coupling, F150) are independent O(1) objects with no locking
      relation — hence the 1.7e-5 near-coincidence.
    entails: >
      The entire charged-lepton SHAPE follows from {delta* = 2/9, eta^2 = 1/2}
      to <= 0.007% with ZERO shape parameters.
    falsification: >
      An improved m_tau that moves delta* off 2/9 (currently -0.89 sigma,
      0.003%) falsifies the principle.
    decision_ref: "key-decisions.md — Weight-as-phase is a founding principle"
    code:
      - path: src/casim/engine/particles/derive_generator_norm.py
        note: "Pre-decision framing. Its R=1 derivation is the F255 content and
               stands; its VERDICT ('E1 does not close') is what the decision
               reverses — E1 closes by ADOPTING a principle, precisely because
               F256 proves the dynamical route cannot. Banner added 2026-07-29.
               Migrated from ca-simulation/derive_generator_norm_from_F118.py at
               roadmap C5 (2026-07-30) WITH THE BANNER INTACT — the roadmap's
               named example of why C0.2 proposes and a human accepts."
      - path: src/casim/engine/particles/derive_lambda6_sextic.py
        note: "Already carries the weight-as-phase section (S4). Migrated from
               ca-simulation/derive_lambda6_sextic.py at roadmap C5."
    tests:
      - path: tests/findings/test_F179_lambda6_relabel.py
        status: partially_superseded
        dead: "D5 verdict bookkeeping: 'one-angle consistency fit ... NOT
               zero-parameter' and listing delta* among fitted_inputs."
        live: "D1 condensate invariants; D2 lambda_6 not a clean rational
               (re-affirmed by F256); D3 3 delta* = Q = 2/3 within 1 sigma — now
               the canonical falsification handle; D4 spectrum to ~0.01%."
      - path: tests/findings/test_F174_shape_angle_2_9.py
        status: partially_superseded
        dead: "S2's conclusion that a rational radian signals a TOPOLOGICAL/flux
               phase rather than a group-theoretic projection — inverted by F175
               and excluded by F253."
        live: "S1 value extraction; S3 model home/triangulation; S4 caveat."

