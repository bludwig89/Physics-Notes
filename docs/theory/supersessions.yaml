  - id: S11-F272-bgfield-refold-removed
    date: 2026-08-01
    kind: superseded
    by: [F272]
    superseded: [F162]
    scope: >
      The `mod 2 pi` refold of k+q in bgfield_loop._Bcoeff_numeric is removed.
      It refolded by a period the rule kernel does not have — omega_even's
      period lattice is sqrt3*fcc, so 2 pi per axis, 4 pi per axis and the plain
      fcc vectors are all NOT periods of it — and therefore evaluated the
      propagator at a genuinely inequivalent momentum. Wilson IS 2 pi-periodic,
      so for it the refold was an exact no-op (2e-14), which is what makes the
      removal safe rather than a change of result.
    reason: >
      The refold destroyed the function's only claim. delta_rule must be q-flat
      (that is how b0 is shown propagator-independent) and the refold
      manufactured a spurious q-dependence indistinguishable from the residual
      log the test exists to detect. Flatness spread 1.58e-2 -> 2.96e-5, a factor
      530, now flatter than the Wilson control. Decisive evidence is
      grid-convergence, not flatness: the old mean moved 70 percent between n=14
      and n=18, the new one moves 0.13 percent. The artifact was invisible on a
      coarse grid and switched on with refinement (a point crosses the cell face
      only when Q > pi/n), which is why it survived.
    impact: >
      b0 = 11 is untouched — b0_gate_symbolic is exact sympy with no grid.
      All three F162 gates still pass. Exactly ONE committed number moves.
      This record also corrects the roadmap's prescription for the module:
      make_kgrid_bcc masks the FCC BZ, which is not a fundamental domain of a
      sqrt3-fcc-periodic function, so applying it would have inserted a
      spurious factor of 4 into a quantity that had no factor-4 error.
    baselines:
      - path: test-results/F162_bgfield_loop.json
        status: stale_by_design
        committed: 2026-06-14
        reason: "G2.rule_shift_mean moves -0.005071 -> -0.012591 because the
                 refold that produced the old value is gone. The old number was
                 not converging (70 percent shift n=14 -> n=18); the new one is
                 (0.13 percent). Re-run and reviewed 2026-08-01."
        clears_by: "Already re-run; `git add test-results/F162_bgfield_loop.json`
                    and flip to live with accepted_by."
