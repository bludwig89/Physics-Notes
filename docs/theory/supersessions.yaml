  - id: S4-F178-full-stress-energy
    date: 2026-06-29
    kind: reclassified
    by: [F178]
    superseded: [F114]
    reclassified: [F106, F173, F174]
    scope: >
      The induced Einstein equation G_munu = (8 pi G/c^4) T_munu is adopted as
      the canonical/fundamental gravity law. The energy-only sourcing
      lap ln K = -(8 pi G/c^4) T^00 (F106) is RECLASSIFIED as its static
      weak-field reduction in a preferred frame — not the fundamental law.
    reason: >
      (a) A T^00-only source is not Lorentz covariant: T^00 is frame-dependent
      and mixes with momentum density and stress under boosts, so it can only be
      a static approximation. (b) F106 already names G_munu = 8 pi G T_munu as
      the parent. (c) The energy-only law has NO neutron-star maximum mass and
      is excluded by PSR J0740+6620.
    entails: >
      By F173 a single impedance-locked scalar (AB == 1) forces anisotropic
      stress and cannot match a perfect fluid under full Einstein, so inside
      matter the metric gains a second independent function and the dynamics are
      GR/TOV. The single-scalar dielectric survives only as the vacuum /
      weak-field representation.
    retained: >
      In vacuum and for p << rho c^2: factor-2 light bending, beta = gamma = 1,
      Mercury, Shapiro, redshift (F64 D-EM9, FA09); the structural
      G = a^2 c^3/(8 pi sqrt(3) hbar) (F79/F107); and the conceptual origin —
      gravity as the induced renormalisation of the (E,B) rotation rate.
    also_superseded:
      - "F114 horizon-free dielectric black hole (+4.6% shadow) -> the exact
         vacuum solution is Schwarzschild; the exponential K = e^{2u} is only
         PPN-order, differing at O(u^2)."
      - "F173/F174 energy-only neutron-star departures -> artifacts of the
         weak-field reduction, not predictions."
      - "Paper VII/XI 'one field, one source (energy)' -> weakened to 'the
         rotation field's FULL stress-energy sources gravity'."
    decision_ref: "key-decisions.md — Gravity sources from the full stress-energy tensor"
    code:
      - path: src/casim/engine/interactions/gravity.py
        note: "canonical in vacuum / weak field (lensing, PPN). Migrated from
               ca-simulation/ca_gravity.py at roadmap C6."
      - path: src/casim/engine/interactions/stellar.py
        note: "strong-field/interior canonical solver, theory='gr'. Migrated
               from ca-simulation/ca_stellar.py at roadmap C6."
      - path: src/casim/engine/interactions/raytrace.py
        note: "RESOLVED at roadmap C6 (was: 'STALE: still computes
               F114_enlargement_pct. Flagged for P6.'). The quantity is KEPT and
               relabelled, not cut: only shadow_uas_GR is compared to data, and
               the two *_F114 fields are the standing EXCLUSION RECORD that
               test_F186 T2 actively gates on (GR shadow < F114 shadow;
               enlargement pinned to +4.63%). eht_predictions()'s docstring now
               states this outright, so the numbers cannot be read as a
               prediction. Deleting them would have removed a live falsification
               gate and drifted a committed baseline key for no gain."
    tests:
      - path: deprecated/tests/test_F114_dielectric_black_hole.py
        status: fully_superseded
        replacement: tests/findings/test_F183_blackhole.py
        retired: 2026-07-30 - 18:55
        note: "The only file in the project that is superseded wholesale. Its
               one non-BH check (D1, sigma=2 -> alpha_2=4pi) is duplicated by
               the live test_F111_second_order_deflection.py D3, so no unique
               coverage is lost. RETIRED at roadmap C7.6: moved from
               tests/findings/ to deprecated/tests/. It stays checkable — the
               banner and this record are the whole point of not deleting it."
      - path: tests/findings/test_F173_tolman_pressure.py
        status: partially_superseded
        dead: "P3 pressure-source omission 3w/(1+3w); P4 neutron-star 2-42%
               central-redshift departure."
        live: "P1/P2 exact sympy tensor algebra — the finding banner states this
               algebra stands and MOTIVATED F178."
      - path: tests/findings/test_F174_stellar_overlay.py
