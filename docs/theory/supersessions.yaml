  - id: S19-F22-velocity-addition-review-retraction
    date: 2026-08-04
    kind: retracted_by_review
    by: [F15]
    superseded: []
    reviews:
      - docs/reviews/F22-review-2026-08-04.md
      - docs/reviews/F22-remediation-2026-08-04.md
    scope: >
      Two of F22's three claims, withdrawn by the 2026-08-04 independent review
      (verdict OVERSTATED; 1 PASS, 2 WEAKENS, 10 FAIL). This record exists
      because F22 carried a hand-written banner naming NO ledger entry -- one of
      the four orphan tombstones the 2026-08-04 triage found in findings/, the
      one directory test_no_orphan_banners did not walk. `superseded:` is
      deliberately EMPTY: F22's claim 2 is correct and load-bearing, so a
      wholesale marking would be false.
    reason: >
      (1) "The SR Lorentz boost acts exactly on the QCA 4-momentum (omega,k)" is
      FALSE, and fails at LEADING order: boosting linearly gives a deviation
      first order in v with coefficient 1/rho - 1, measured -0.0930513 against
      the predicted -0.0931003 at m=0.5. At a finite boost that is a 7.1% error
      in omega at m=0.7, k=1.0, v=0.3. The finding contradicts itself -- its own
      Step 4 reports d_qca = v(1 - 1/rho) = 3.35e-6 != 0 and calls it "the
      fundamental LV mismatch".
      (3) The "deformed velocity-addition formula" is UNDEFORMED. In the
      nonlinear variables E = sin(omega), P = n sin(ka)/a one has
      E^2 - c_lat^2 P^2 = m^2 identically and u_g = c_lat^2 P/E exactly, so the
      group velocity composes by ORDINARY Einstein addition -- verified to
      5.6e-17. F22's own formula misses the lattice's actual boost response by
      10^2-10^3x: the true leading deviation is first order in v, not the
      third-order 8 beta_LV u v (u+v) F22 headlines.
      Separately, the finding's own CHECK of claim 2 was a definitional
      tautology -- it set beta_LV = (1 - rho)/2 and then verified
      rho - (1 - 2 beta_LV), which is identically zero for any expression; the
      referee obtained residual 0 from a deliberately wrong rho, and then from
      rho = 42. That check is fixed, gated by F22-rho-identity-and-offshell with
      a negative control asserted to go red.
    retained: >
      Claim 2 -- rho(m) = tan(theta)/theta = 1 - 2 beta_LV -- is CORRECT,
      confirmed by an independent route at sympy zero, and is a restatement of
      F15's closed form. It is now checked AGAINST F15's module rather than
      against itself. The measured O(vk) coefficient by which claim 1 fails is
      itself a live result: the false claim now has a number attached instead of
      being asserted away.
