      STRUCTURAL: the canonical vacuum representation is A = 1/K = e^{-2u},
      B = K = e^{+2u}, AB == 1 (F64, reclassified by F178). At O(u) that is
      A = 1 + 2phi/c^2, B = 1 - 2phi/c^2 -- exactly and only Fork B. Fork E
      (src/casim/engine/forks/gravity/gr_fork_E_tensor.py:24) says so in as many
