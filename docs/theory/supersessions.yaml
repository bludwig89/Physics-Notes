  - id: S9-P3.5-one-gauge-energy-convention
    date: 2026-08-01
    kind: superseded
    by: [F270]
    superseded: []
    note: >
      `superseded:` is empty on purpose and the emptiness is the point: the
      sum(E^2+B^2) convention was never established by a finding. It was six
      code sites that had drifted apart from coupled.field_energy and from
      gravity.T00_field_energy, which is exactly how it survived unnoticed —
      there was no claim to review.
    scope: >
      The engine's gauge-field energy is one convention, U = 1/2 sum(E^2+B^2),
      defined once in casim.engine.core.channel.field_energy. Six channels
      previously summed WITHOUT the 1/2 (photon_pair, w_chiral, z_even,
      gluon_bcc, photon_sourced, gluon_sourced) and now route through it, so
      their reported energy HALVES. coupled.field_energy is bound to the same
      object rather than being an agreeing second definition.
    reason: >
      Roadmap blocker B4. PhotonPairChannel.energy was exactly twice
      coupled.field_energy for the same field, and gravity.T00_field_energy —
      the function that SOURCES gravity from a gauge field — always carried the
      1/2, so a field weighed half what it cost. Nothing could sum the two, which
      is why B4 recorded "nothing a coupled run could fail". The 1/2 is the
      physical field energy density and is what gravity already used; keeping the
      other convention would make every engine-wide energy twice what any GR or
      QED comparison expects. Decision taken by Ben, 2026-07-31, after the
      baseline impact of both options was measured rather than estimated.
    impact: >
      ZERO registry-declared baselines move — measured before the change, not
      discovered after. 55 git-tracked result dumps carry an absolute gauge
      energy and move by EXACTLY 2x, and only when re-run; the factor is exact
      and known, so those are supersessions rather than drift. Ratio-valued
      observables (norm_conservation's rel_drift, every dispersion and unitarity
      residual) are scale-invariant and do not move at all.
    retained: >
      Channel.energy keeps its meaning as the conserved DRIFT PROBE, which for
      spinor channels is a dimensionless probability norm and not an energy. The
      additive energy is a separate protocol, Channel.energy_density, in one
      convention across every channel — unifying the 1/2 alone would not have
      made a total energy well defined.

