# ---------------------------------------------------------------------------
# The machine-readable face of docs/theory/key-decisions.md.
# ---------------------------------------------------------------------------
version: 1
updated: "2026-08-18 - 23:40"

about: >
  Roadmap P0.3. key-decisions.md is the human narrative; this file is what
  tooling reads. Every supersession in the project appears here exactly once,
  with the findings on both sides, the code and tests affected, and — crucially
  — what SURVIVED. Almost nothing in this project is superseded wholesale.

  Granularity matters. An earlier audit flagged ~14 test files as "testing
  superseded physics"; on inspection exactly ONE was fully superseded. The rest
  were partial (a dead verdict wrapped around live algebra) or false positives.
  So the unit here is a CHECK, not a file: `dead_checks` and `live_checks` name
  the specific gate IDs inside a test. Marking a whole file superseded when only
  its conclusion is dead would silently retire working coverage — a worse
  outcome than the sprawl this file replaces.

  -- A SUPERSESSION HAS TWO DIRECTIONS (added 2026-08-17, with S20) ----------

  For its first year this file propagated INWARD only. `apply_supersession_banners.py`
  stamps each record into the superseded FILE, and `test_no_orphan_banners` keeps
  the two in step. Nothing propagated OUTWARD, to the rubric rows, ledgers and
  claim cards that cite the finding as EVIDENCE. So a document could go on
  grading a row against a reading replaced months earlier, and every check here
  stayed green.

  What it cost, measured: completeness rubric row B9 ("running of alpha, EW
  couplings") cited F115 as its electroweak evidence for three consecutive
  reports — 2026-08-02, -04 and -07 — while F138 (2026-06-11) and F231
  (2026-07-02) had superseded that reading. Two failures stacked. F115 had no
  record here at all, so there was no banner and nothing for the orphan check to
  find; and `check_claims.py` rule 4 fires only when a LIVE card rests on WHOLLY
  superseded ground, deliberately not on partials — which leaves the common case,
  a partial supersession cited without its replacement, with no owner.

  So there are now two obligations when you add a record here, not one:

    1. INWARD — run `make stamp`. The banner goes on the superseded file.
    2. OUTWARD — run `make citations`. Every markdown table row in the CURRENT
       completeness report and in open-derivations.md, and every claim card's
       front matter, must either name a finding from this record's `by:` list
       alongside the superseded one, or say `superseded` / name this record`s id
       in the same row. `make gate` runs it; the unit is one TABLE ROW, because
       an acknowledgement 400 lines away from the row that gets it wrong is how
       B9 read for three reports.

  Both are cheap. The second one is the one nobody thought of, which is why it
  is written here rather than only in the tool.

status_vocabulary:
  fully_superseded:   Everything the file tests has been replaced. Safe to mark.
  partially_superseded: Some claims dead, others load-bearing. Never blanket-mark.
  historical_baseline: Deliberately retains the superseded object as the standing
                       exclusion record or regression comparison. Not a defect.
  sub_claim_superseded: >
    ADDED 2026-08-04. The record's `retained:` keeps the file's CONCLUSION; what
    was replaced is a sub-claim inside it -- a redundant constraint row, a
    superseded attack script, an attribution. S13 (F165) and S15 (F230) both say
    RETAINED: EVERYTHING, and for those two neither `fully_` nor
    `partially_superseded` is honest: "partially superseded" tells a reader the
    result is in doubt when the ledger says it is not. The 2026-08-04 triage
    (docs/status/findings-supersession-triage-2026-08-04.md §5.2) recommended
    this term precisely so that a correct-but-re-attributed finding is not
    bannered as damaged goods.

# ---------------------------------------------------------------------------
# `baselines:` — provenance for committed result artifacts (added 2026-07-31).
#
# The problem: a committed `test-results/*.json` is the accepted value, and the
# C7 baseline diff fails when a run no longer reproduces it. But a baseline that
# predates a MODEL CHANGE looks exactly like one that just broke — accepting a
# drift was a bare `git add` with no recorded reason, indistinguishable from
# accepting a regression. The ledger already carries provenance for code and
# tests; artifacts were the gap.
#
# A `baselines:` entry sits on the supersession record whose physics moved, so
# the reason a number is out of date is the same object that records what
# replaced it.
# ---------------------------------------------------------------------------
baseline_status_vocabulary:
  stale_by_design: >
    DECIDED. The committed numbers predate this record's supersession, so a
    re-run is EXPECTED to differ. `casim test` reports STALE, not FAIL —
    the record keeps its failure mode for structural breakage while no longer
    crying wolf about physics that was deliberately replaced. Clearing it means
    re-running, reviewing, `git add`, and flipping to `live` with `accepted_by`.
  candidate: >
    NOT DECIDED. Triage flagged the artifact because its test claims findings
    this record touches, and a real run drifts. `casim test` still reports FAIL —
    a candidate excuses nothing. It exists so the queue is countable and nobody
    re-derives the triage.
  live: >
    Re-blessed after this supersession: the committed numbers are current and a
    drift is a real regression. `accepted_by` names the finding whose result the
    baseline now encodes.

kind_vocabulary:
  superseded:   Replaced outright by a later result.
  reclassified: Still true, but its STATUS changed (e.g. fundamental law ->
                limiting case). The equations are unchanged.
  demoted:      Downgraded from anchor/input to consistency check.
  deprecated:   Removed from the active series; a documentation decision.
  retracted_by_review: >
    ADDED 2026-08-04. A claim inside a finding is withdrawn by an INDEPENDENT
    REVIEW rather than replaced by a successor finding. The distinction is real
    and the ledger lacked it: `superseded` presumes something took the claim's
    place, and a reader who saw F22 filed as `superseded` would go looking for
    the finding that redid it. Nothing did -- attack 1 is simply false and
    attack 3 shows the headline was a misnomer. `by:` names whatever the
    corrected result now rests on (for F22, F15's independently derived closed
    form, which the fixed check finally compares against); the review and
    remediation documents are named in `reviews:` and are the authority.
  methodology:  An ENGINEERING decision reversed, not a physics result. Added at
                roadmap C9 for the D2 -> D6 reversal. It gets its own kind
                rather than overloading `superseded` because a methodology
                record has no findings on either side, and a reader who saw one
                filed as `superseded` would reasonably look for the physics that
                replaced it. `by:` and `superseded:` name DECISIONS (D-ids),
                not findings.

