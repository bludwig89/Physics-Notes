  - id: S1-F69-sigma-bilinear-photon
    date: 2026-06-01
    kind: superseded
    by: [F69]
    superseded: [F65, F66, F67]
    scope: >
      The composite sigma-bilinear photon (ca_maxwell.py), which assigned each
      helicity to its own chiral branch (Omega^pm) and is therefore
      BIREFRINGENT. The photon is instead a bound PAIR of two spin-1/2 Weyl
      quanta each carrying k/2 on opposite branches, giving the
      helicity-symmetric Omega_pair = Omega_even.
    reason: >
      The branch-split photon is excluded by GRB/AGN polarimetry at the F64
      cell size. The pairing is also the physical realization of the U(1)
      identity channel that minimal coupling FORCES (F68) — so the correct
      photon was not merely permitted, it was required.
    retained: >
      The sigma-bilinear FIELD CONSTRUCTION survives for the massive and
      non-Abelian sectors (W / Z / gluon), which are not under the polarimetry
      bound. Only the photon attribution died.
    decision_ref: "key-decisions.md — De Broglie Paired-Spinor Photon"
    code:
      - path: ca-simulation/ca_maxwell.py
        note: retained for W/Z/gluon; no longer the photon
      - path: ca-simulation/ca_photon_pair.py
        note: the canonical photon
    tests:
      - path: tests/findings/test_su2_photon_bridge.py
        status: partially_superseded
        dead: "B1's identification of the single-branch isospin-singlet
               sigma-bilinear as THE PHOTON."
        live: "A1 SU(2) invariance of c_lat/Omega(k); B2-B5b W-triplet adjoint
               transform, magnitude invariance, transversality, rotation rate."
      - path: tests/findings/test_FG6_two_helicity_photon.py
        status: partially_superseded
        dead: "FG6.1-FG6.6 as PHOTON claims (two-helicity branch split,
