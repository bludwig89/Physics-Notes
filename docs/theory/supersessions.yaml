  - id: S22-F298-mixed-matching-C_F-and-the-X1-branch
    date: 2026-08-18
    kind: superseded
    by: [F325]
    superseded: [F298, F299, F303]
    scope: >
      The CASIMIR READING of the F110 C7 identity, and with it the X1 fork's
      branch A. NOT the arithmetic on either side -- every number in F298, F299
      and F303 reproduces, and F325 reproduces them before disagreeing with what
      they were taken to mean.

      F298 (2026-08-05) evaluated C7 as chi_k = s(k)^2 / (4 g^2 C_2(antisym k)):
      the ABELIAN rotor's Z_N symmetric residue in the numerator against the
      SU(N) gauge theory's quadratic Casimir in the denominator. That is a MIXED
      matching -- the two sides are eigenvalues of operators belonging to
      different theories -- and it is the sole origin of the C_F that created
      the fork. Under EITHER self-consistent evaluation (both sides abelian, or
      both sides SU(N)) chi = 1/(4 g^2) identically, for every N and every
      irrep, exact over Q. F294 had already measured the all-abelian case
      N-free with worst deviation literally 0.0 and given the reason -- "the
      s(m)^2 cancels between the electric term and the rotor level" -- and the
      same cancellation holds with C_2 on both sides.

      The mixed evaluation is not a rival convention either: off the k-string
      tower it is level-dependent at N = 3 as well. F324 section 3 U1c found the
      sextet leg (chi_6 = 3/10 against the tower's 3/4) and booked it as
      "falsifier 5b ... the most serious structural exposure on the upper side";
      F325 completes the table and finds chi in {3/4, 3/10, 3/16} plus UNDEFINED
      for the adjoint, decuplet and 27, where the Z_3 rotor's s^2 = 0 against
      C_2 != 0 -- i.e. the mixed reading assigns ZERO electric cost to a
      triality-0 link.

      Which evaluation the model is entitled to turns on whether the integer
      spectrum is derived from the rule. It is not: the rule's own (E, B) are
      continuous real fields under an SO(2) rotation (F26,
      weak_wmu._f26_rotation_step), the integer spectrum is introduced as the
      exactly-solvable case (F101 section 2; link_hamiltonian "the integer
      (compact) electric field", U(1) "truncated at |m| <= m_max"), Gauss's law
      is solved by a HEIGHT representation that exists only for abelian groups,
      and the model's own links are SU(3)-valued matrices (strong.py, gluon.py,
      bcc_action.plaquette_field_strength_su3, F94, F99 D3, group derived in
      F317). link_hamiltonian.py holds no SU(3) matrix at all. F298 and F303
      both already call the Z_3 side an "effective description" of SU(3).

      Independently of all of that, branch A is excluded quantitatively: it
      requires Lambda_MSbar/Lambda_rule = 3.4e6, which is 5.63 decades outside
      F280 S5 / CL252's committed [1, 7.98] and needs the rule's own loops-only
      one-loop constant to be 7.24x Wilson's for an action F287 section 4
      MEASURES at 5.3-5.7x SMALLER discretisation error than Wilson's.
    reason: >
      Written 2026-08-18 during the X1 research pass. The fork was framed on
      2026-08-06 by F299 (12:35) and F303 (19:58); F280's bracket had landed on
      2026-08-05 (12:40), the previous day, and the two were never compared --
      the ledger's own d_1 row prints "required 1.773444 on branch B, ~3.4e6 on
      branch A" and, in the same cell, "band in [1, 7.98]". F303 section 4.1
      computed the 3.4e6 and compared it against F144's A4 residual and Wilson's
      28.81, the two comparisons available in June, but not against the model's
      own bracket.

      The structural half has the same shape as the lesson F303 section 5 drew
      about F101 section 7: a deferral coming due. F294 section 5 wrote "H1 is
      the model's choice, and it has never been validated against a genuine
      SU(N) link Hamiltonian" and made building one its Remains item 1. That
      Hamiltonian ALREADY EXISTED -- su3_ladder.py, 2026-06-07, five days before
      F144, finding F111b, record F111-tree-gauge-su3-ladder -- and none of
      F294, F298, F299 or F303 cites it. F299's cross-reference list even names
      "F111-su3-ladder-casimir-scaling", a dangling link to it.

      The mechanical enabler is a D9 gap and is recorded because it is
      generalisable: F298-casimir-ladder declared two controls (tower=symmetric,
      n_max=3) and BOTH perturb the tower. Neither perturbed the MATCHING, which
      was the one assumption doing all the work, so the record could not see its
      own premise fail. The control is now declared (numerator=casimir, reddens
      exactly L2 and L3, verified CONTROL).
    impact: >
      X1 leaves Part D of the open-derivations ledger: branch A is TESTED and
      CLOSED, branch B (chi = 1, g_s = 1/2, alpha_s(mu_0) = 1/(16 pi)) is
      ADOPTED, and the "centre-normalised coupling with an SU(N_c) beta
      function" inconsistency X1 named never existed. F144's headline, F119's
      19-decade hierarchy channel, F233's factor-1.9 mass-scale result and
      CL022's 2.1 sigma framing all stand and stop being contingent.

      Two things move the other way and are not softened. CN19 falls: "the C7
      identity is well-defined only for N_c <= 3" is a property of the mixed
      matching. F324's UPPER constraint falls with it, since F324 imports
      F298's criterion verbatim as its upper bound -- so B10 closes on ODD N_c
      only, {3, 5, 7, ...}, its lower (Z_2 doublet parity) leg untouched. F324's
      incremental content over F298 was priced by its own section 8 at "one
      bit"; this spends it.

      d_1's role changes and does not disappear: it now PINS alpha_s(M_Z) inside
      branch B and closes E3/Q1/Q2, rather than choosing between branches six
      decades apart. Its two-sided falsifier is unchanged and is now the
      sharpest statement in the sector -- a completed vertex computation
      returning Lambda outside [1, 7.98] falsifies the g_s = 1/2 lock or F280's
      monotonicity assumption, and a return of 3.4e6 would REINSTATE branch A
      and CN19 with it.

      No test changes verdict. Exactly three registry records consume the edited
      modules -- F298-casimir-ladder, F303-coupling-normalisation, and
      F324-ncolour-bracket via derive_ncolour_bracket.py -- and all three pass.
    retained: >
      ALMOST EVERYTHING, which is why all three files are partially_superseded
      rather than blanket-marked.

      F298: result (2), the exact proportionality of the two ladders at N = 3
      with constant C_F, is unchanged arithmetic and is what makes the dispute a
      single rational number rather than an interpretation. Result (3)'s
      k-string degeneracy at N = 3 is correct about that tower (F299 reproduced
      it as its own control S2b). Its section 5 scope note -- that the tower is
      a restriction, not the full link Hilbert space -- is exactly the sentence
      that turns out to matter most.

      F299: EVERYTHING, re-characterised rather than contradicted. Its
      sigma_6/sigma_3 = 2.4911511 reproduces independently to 5-6 significant
      figures, its relocation of F298's degeneracy from N = 3 to the
      antisymmetric tower is right, and its reinstatement of F294's
      discriminator is right. What is dead is only the INFERENCE that the
      measurement selects a coupling normalisation: the same engine gives 2.49115
      at beta = 24 (branch B) and 2.49540 at beta = 32 (branch A), because
      Casimir scaling in d = 2 is a theorem about the SU(3) Wilson measure at
      weak coupling, true at every beta. Read correctly, F299 establishes that
      the link variables carry SU(3) representation content -- which is the
      PREMISE under which the C_F cancels. It is evidence FOR branch B.

      F303: EVERYTHING except the framing as an unchooseable fork. Its three
      closed candidates are closed and stay closed (scheme constant off by 26x;
      the BCC graph's absence of a 3-bond loop, by parity and exhaustive
      enumeration; the Cartan reading's Landau pole). Its section 2 audit of
      F144 A1 -- steps 1-2 group-blind, step 3 the break -- is right and is what
      located the problem. Its N1 lemma is reused verbatim by F325 section 6.
      Its closing sentence asks for "a fourth normalisation nobody has written
      down"; the answer is that there is no fourth normalisation, because there
      is nothing to bridge.
