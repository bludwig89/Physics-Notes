# F195 — matched CONTROL for stable_atom_lithium (no nuclear well, no e-e field).
version: 2
name: stable_atom_lithium_free
title: "Li free control (F195) — no binding, ballistic dispersal"
description: "Matched control: Li orbitals with binding switched off; the cloud disperses toward the box."
lattice: {L: 28, topology: bcc, c_lat: 0.5773502691896258}
seed: 7
ticks: 120
channels:
  - type: element_atom
    name: atom
    Z: 3
    N: 4
    b: 30000
    free: true
    fine:   {L: 12, sigma: 0.5, spread: 2.0}
    coarse: {L: 28, m: 1.0, k: 0.6, dt: 0.4}
observers:
  - {type: atom_stability_readout, every: 20}
output: {json: test-results/casim_stable_atom_lithium_free.json}
