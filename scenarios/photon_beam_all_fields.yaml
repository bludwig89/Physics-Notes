# Photon beam through all cubic-compatible fields — `2026-06-06 - 17:05`
#
# A travelling Gaussian photon beam (init: beam — one-sided F = E + iB packet,
# carrier k0 = 2π·m/L along +x) propagates across a lattice that also carries
# every field channel legal on a cubic topology: W (chiral), Z (even), and the
# F64 dielectric gravity background.  (gluon_bcc / weyl_bcc are BCC-only and
# live in the companion scenario bcc_fields_companion.yaml.)
#
# What it checks:
#   1. beam_track: the beam's energy centroid moves along +x at the analytic
#      finite-k group velocity dΩ_pair/dk|k0 (→ c = 1/√3 as k0 → 0).
#   2. norm_conservation: every channel separately norm-conserving while
#      coexisting on one lattice.
#   3. Tier-1 independence: the γ beam passes through live W/Z/gravity fields
#      without interacting — its speed and norm are identical to a γ-only run
#      (same seed), the engine-level statement of channel superposition.
#
# Sandbox smoke:   casim run scenarios/photon_beam_all_fields.yaml
# Production:      casim run scenarios/photon_beam_all_fields.yaml --L 96 --ticks 300
name: photon_beam_all_fields
title: "Photon Beam Through All Cubic Fields"
description: "A travelling Gaussian photon beam (one-sided F = E + iB packet) crosses a lattice carrying live W, Z, and F64 gravity channels: tracks beam speed vs dΩ_pair/dk|k0, per-channel norm conservation, and Tier-1 non-interaction."
lattice: {L: 32, dims: 3, topology: cubic, c_lat: 0.5773502691896258}  # 1/√3
seed: 11
ticks: 60
channels:
  # k0·σx = (2π·4/32)·4 ≈ 3.14 → backward (−k0) leakage e^{−(k0σx)²} ≈ 5e−5.
  # σ⊥ = 6 collimates the beam: the speed deficit vs dΩ/dk|k0 is diffraction,
  # ≈ 1/(2(k0σ⊥)²) ≈ 2.3% here, measured 2.5% (shrink with --L 96, sigma [4,12,12]).
  - {type: photon_pair, name: photon_beam, init: beam, axis: x, m_index: 4, sigma: [4.0, 6.0, 6.0]}
  - {type: w_chiral, name: w_field}
  - {type: z_even, name: z_field}
  - {type: gravity_dielectric, name: gravity, M: 1.0, sigma: 3.0, G: 1.0}
observers:
  - {type: beam_track, channel: photon_beam, every: 1}
  - {type: norm_conservation, every: 5}
  - {type: energy_trace, every: 10}
  - {type: field_snapshot, every: 60}
output:
  json: test-results/casim_photon_beam_all_fields.json
