# Real-space proton (~1 fm) — confined uud bound by the LIVE colour-dielectric
# bag (F137), on a block-spin physical patch (F129–F133) so the tractable L
# super-cells represent a nucleon-scale (L·block)^3 block of physical cells
# (roadmap-scale-to-real-space §0). The isospin partner is
# realspace_neutron_1fm.yaml — this pair carries the FA06/F40 n–p structure:
#
#   ISOSPIN MASS SPLIT (strong term, FA06/F40). The model's down–up CURRENT-mass
#   gap is m_d − m_u = 4.67 − 2.16 = 2.51 MeV, neutron-heavier (ca_si_scale.py,
#   F40). The nucleon mass is the dynamical CONSTITUENT mass m_c≈311 MeV (F97),
#   so the split is a small current-mass increment on top of equal constituents:
#   with the stand-in m_c → 0.9 lattice, δ = 0.9·(2.51/311) = 0.00726, hence
#   m_u = 0.900, m_d = 0.90726 (|m|≤1 QCA). Proton uud carries one heavy d,
#   neutron udd two → m_n > m_p in the strong sector by δ (correct sign).
#
#   CHARGE / EM SELF-ENERGY (FA06 competing term, −1.00 MeV). Quarks carry their
#   species charges (u=+2/3, d=−1/3) and source a photon Coulomb field; the
#   proton (net +1) carries EM self-energy, the neutron (net 0) largely cancels.
#
# No SI fm/cell is asserted (F107 ruler is Planck-scale; absolute fm/eV stay
# P6/scale-gated, F123). The absolute +1.51 MeV n–p value lives in the
# njl_nucleon spectral channel (FA06); here the pair EXHIBITS the isospin
# structure (mass + charge) dynamically. Tiers grow the represented patch.
version: 2
name: realspace_proton_1fm
title: "Real-Space Proton ~1 fm (block-spin patch, isospin-split)"
description: "Confined uud colour-singlet (bag F137) with the FA06/F40 isospin structure — down-quark heavier by the 2.51 MeV current-mass gap (scaled), fractional charges + photon Coulomb (net +1, EM self-energy) — on a block-spin physical patch: L super-cells represent a nucleon-scale (L·block)^3 block of physical cells."
lattice: {physical_patch: 32, block: 2, topology: bcc, c_lat: 0.5773502691896258}
seed: 11
ticks: 120
channels:
  - {type: gluon_sourced, name: gluon, sources: [u_r, u_g, d_b], g_lat: 0.5, dt: 1.0}
  # live colour-dielectric bag (the confining wall)
  - {type: colour_bag, name: bag, sources: [u_r, u_g, d_b], M_bag: 8.0, phi0: 0.01, lam: 1.5}
  # photon Coulomb field — carries the proton's EM self-energy (FA06 −1.00 MeV term)
  - {type: photon_sourced, name: photon, sources: [u_r, u_g, d_b],
     dt: 0.1, g_em: 1.0, coulomb: true, g_coulomb: 1.0}
  # uud: two up (Q=+2/3), one down (Q=−1/3); down is heavier by the current-mass gap
  - {type: quark_dirac, name: u_r, species: u_L, colour: r, mass: 0.900,
     init: {center: [7, 8, 8], width: 1.3},
     couplings: {strong: gluon, em: photon}, eps_strong: 0.05, confine: {mode: scalar, field: bag}}
  - {type: quark_dirac, name: u_g, species: u_L, colour: g, mass: 0.900,
     init: {center: [9, 8, 8], width: 1.3},
     couplings: {strong: gluon, em: photon}, eps_strong: 0.05, confine: {mode: scalar, field: bag}}
  - {type: quark_dirac, name: d_b, species: d_L, colour: b, mass: 0.90726,
     init: {center: [8, 10, 8], width: 1.3},
     couplings: {strong: gluon, em: photon}, eps_strong: 0.05, confine: {mode: scalar, field: bag}}
observers:
  - {type: norm_conservation, every: 30, channels: [u_r, u_g, d_b]}
  - {type: unification_readout, every: 20, cluster: [u_r, u_g, d_b], gluon: gluon, photon: photon}
output: {json: test-results/casim_realspace_proton_1fm.json}
