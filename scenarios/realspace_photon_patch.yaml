# Real-space photon patch (block-spin carrier, F129–F133).
# The RIGOROUS "real-space sized" demonstration: the paired-photon even law is
# the propagator class proven faithful under the block-spin transform R_b
# (F129 c_lat fixed point, F133 [R_b, evolution]=0 on band-limited fields), so a
# tractable lattice of L super-cells represents a patch of (L·block)^3 physical
# cells.  A live R_b event mid-run coarse-grains the field by the renormalised
# rule Ω(κ/block) — the adaptive-resolution CA step.
#
# The suite's real-space tiers GROW `block` (the represented physical patch),
# holding the super-cell L fixed, so the represented physical-cell count climbs
# by orders of magnitude while the compute stays tractable.  No SI fm/cell is
# claimed (canonical ruler is Planck-scale, F107; absolute scale is P6-gated).
version: 2
name: realspace_photon_patch
title: "Real-Space Photon Patch (block-spin carrier)"
description: "Paired-photon even law on a physical patch declared via block-spin: L super-cells represent (L·block)^3 physical cells (F133), with a live R_b coarse-graining event. The proven-faithful real-space carrier."
lattice: {physical_patch: 32, block: 2, dims: 3, topology: cubic, c_lat: 0.5773502691896258}
seed: 7
ticks: 40
channels:
  - {type: photon_pair, init: random}
blockspin:
  - {at: 20, factor: 2}
observers:
  - {type: norm_conservation, every: 10}
  - {type: field_snapshot, every: 40}
output:
  json: test-results/casim_realspace_photon_patch.json
