# F139 — Confined proton bound by the SELF-CONSISTENT dual-GL bag field.
# Same uud colour quarks as proton_bag.yaml (F137), but the colour_bag channel
# runs in `backreaction: true` mode: the condensate f(x) and the confined
# colour-electric flux are solved to mutual consistency each tick (the genuine
# dual-Ginzburg-Landau loop — the flux that the condensate confines is itself
# what melts it). Closes the F137 §5 open edge: the tube stays connected and
# linear to arbitrary separation instead of pinching off at ~2λ.
name: proton_bag_sc
title: "Confined Proton — self-consistent dual-GL bag (F139)"
description: "uud colour quarks confined by a self-consistent dual-Ginzburg-Landau bag: the colour-electric flux the condensate confines is what melts it, the two fields solved to mutual consistency each tick. Closes F137's mean-field pinch-off."
lattice: {L: 16, topology: bcc, c_lat: 0.5773502691896258}
seed: 11
ticks: 60
channels:
  - {type: gluon_sourced, name: gluon, sources: [u_r, u_g, d_b], g_lat: 0.5, dt: 1.0}
  # self-consistent dual-GL bag (F139): backreaction loop, warm-started per tick
  - {type: colour_bag, name: bag, sources: [u_r, u_g, d_b], M_bag: 8.0,
     backreaction: true, xi: 1.2, eps_floor: 0.02, dtau: 0.03,
     sc_iters: 16, g_src: 40.0}
  - {type: quark_dirac, name: u_r, species: u_L, colour: r, mass: 0.9,
     init: {center: [7, 8, 8], width: 1.3},
     couplings: {strong: gluon}, eps_strong: 0.05, confine: {mode: scalar, field: bag}}
  - {type: quark_dirac, name: u_g, species: u_L, colour: g, mass: 0.9,
     init: {center: [9, 8, 8], width: 1.3},
     couplings: {strong: gluon}, eps_strong: 0.05, confine: {mode: scalar, field: bag}}
  - {type: quark_dirac, name: d_b, species: d_L, colour: b, mass: 0.9,
     init: {center: [8, 10, 8], width: 1.3},
     couplings: {strong: gluon}, eps_strong: 0.05, confine: {mode: scalar, field: bag}}
observers:
  - {type: norm_conservation, every: 20, channels: [u_r, u_g, d_b]}
  - {type: unification_readout, every: 20, cluster: [u_r, u_g, d_b]}
output: {json: test-results/casim_proton_bag_sc.json}
