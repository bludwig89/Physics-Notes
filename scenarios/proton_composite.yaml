# Composite hadron pilot (roadmap-particle-layer.md P4): the F71 proton built
# as a stacked multi-quark particle (uud, ε_abc colour singlet) on one BCC
# lattice, alongside the gravity background it couples to. The structural
# hadron — exact aggregate quantum numbers (Q=+1, B=1, T3=+1/2) and the
# colour-singlet invariant — propagates its three constituents by the audited
# free BCC Weyl kernel; the dynamical confining bound state is a later phase.
name: proton_composite
title: "Proton Composite"
description: "Composite hadron pilot (P4): the F71 proton as a stacked uud colour-singlet with exact aggregate quantum numbers (Q=+1, B=1, T3=+1/2); constituents propagate by the free BCC Weyl kernel."
lattice: {L: 16, topology: bcc, c_lat: 0.5773502691896258}
seed: 3
ticks: 40
channels:
  # static F64 dielectric background (the proton has Q=+1, B=1 → couples to gravity + em)
  - {type: gravity_dielectric, name: gmass, M: 2.0, sigma: 3.0}
  # the proton: three quark constituents stacked on the three colours
  - type: composite
    name: proton
    composite: proton
    init: {center: [8, 8, 8], width: 1.5, k0: [0.3, 0.0, 0.0]}
observers:
  - {type: norm_conservation, every: 5}
  - {type: particle_readout, every: 5}
