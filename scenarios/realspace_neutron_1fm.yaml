# Real-space neutron (~1 fm) — confined udd bound by the LIVE colour-dielectric
# bag (F137), the isospin partner of realspace_proton_1fm.yaml. Same binding
# mechanism, block-spin physical patch (F129–F133), and FA06/F40 isospin
# structure — but udd (one up + two down) instead of uud:
#
#   ISOSPIN MASS SPLIT (strong term, FA06/F40). down–up current-mass gap
#   m_d − m_u = 2.51 MeV, neutron-heavier (ca_si_scale.py, F40). Scaled to the
#   constituent stand-in (m_c≈311 MeV → 0.9 lattice, F97): δ = 0.9·(2.51/311) =
#   0.00726, so m_u = 0.900, m_d = 0.90726. The neutron carries TWO heavy d
#   (proton one) → m_n > m_p in the strong sector by δ — correct sign.
#
#   CHARGE / EM SELF-ENERGY (FA06 competing term). Quarks carry species charges
#   (u=+2/3, d=−1/3) and source a photon Coulomb field; the neutron is net 0
#   (+2/3 −1/3 −1/3) so its EM self-energy largely cancels, vs the proton's net
#   +1 — the FA06 competition that leaves m_n − m_p = +1.51 MeV.
#
# No SI fm/cell asserted (F107 ruler Planck-scale; absolute fm/eV P6-gated,
# F123). The absolute +1.51 MeV value lives in the njl_nucleon spectral channel
# (FA06); here the pair EXHIBITS the isospin mass+charge structure dynamically.
name: realspace_neutron_1fm
title: "Real-Space Neutron ~1 fm (block-spin patch, isospin-split)"
description: "Confined udd colour-singlet (bag F137) with the FA06/F40 isospin structure — two heavy down quarks (current-mass gap 2.51 MeV, scaled) and net-0 charge so EM self-energy cancels (vs proton +1) — on a block-spin physical patch: L super-cells represent a nucleon-scale (L·block)^3 block of physical cells. Heavier than the proton by the n–p split, correct sign."
lattice: {physical_patch: 32, block: 2, topology: bcc, c_lat: 0.5773502691896258}
seed: 11
ticks: 120
channels:
  - {type: gluon_sourced, name: gluon, sources: [u_r, d_g, d_b], g_lat: 0.5, dt: 1.0}
  - {type: colour_bag, name: bag, sources: [u_r, d_g, d_b], M_bag: 8.0, phi0: 0.01, lam: 1.5}
  # photon Coulomb field — the neutron is net 0, so this self-energy largely cancels
  - {type: photon_sourced, name: photon, sources: [u_r, d_g, d_b],
     dt: 0.1, g_em: 1.0, coulomb: true, g_coulomb: 1.0}
  # udd: one up (Q=+2/3), two down (Q=−1/3); both downs heavier by the current-mass gap
  - {type: quark_dirac, name: u_r, species: u_L, colour: r, mass: 0.900,
     init: {center: [7, 8, 8], width: 1.3},
     couplings: {strong: gluon, em: photon}, eps_strong: 0.05, confine: {mode: scalar, field: bag}}
  - {type: quark_dirac, name: d_g, species: d_L, colour: g, mass: 0.90726,
     init: {center: [9, 8, 8], width: 1.3},
     couplings: {strong: gluon, em: photon}, eps_strong: 0.05, confine: {mode: scalar, field: bag}}
  - {type: quark_dirac, name: d_b, species: d_L, colour: b, mass: 0.90726,
     init: {center: [8, 10, 8], width: 1.3},
     couplings: {strong: gluon, em: photon}, eps_strong: 0.05, confine: {mode: scalar, field: bag}}
observers:
  - {type: norm_conservation, every: 30, channels: [u_r, d_g, d_b]}
  - {type: unification_readout, every: 20, cluster: [u_r, d_g, d_b], gluon: gluon, photon: photon}
output: {json: test-results/casim_realspace_neutron_1fm.json}
