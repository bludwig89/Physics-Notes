# BCC companion to photon_beam_all_fields — `2026-06-06 - 17:05`
#
# The fields that CANNOT share the photon's cubic lattice: the BCC Weyl walk
# and the colour-octet gluon (both topology: bcc), over the same F64 gravity
# background (topology-agnostic).  Together with photon_beam_all_fields.yaml
# this covers every Tier-1 field channel in the registry, split by topology.
#
# What it checks: all three coexist on one BCC lattice with independent
# norm conservation, exact Weyl unitarity, and per-channel dispersion.
#
# Sandbox smoke:   casim run scenarios/bcc_fields_companion.yaml
# Production:      casim run scenarios/bcc_fields_companion.yaml --L 48 --ticks 400
name: bcc_fields_companion
title: "BCC Fields Companion"
description: "Companion to photon_beam_all_fields: the BCC-only channels (Weyl walk + colour-octet gluon) over the same F64 gravity background — norm conservation, exact unitarity, and dispersion for every field that cannot share the photon's cubic lattice."
lattice: {L: 16, dims: 3, topology: bcc, c_lat: 0.5773502691896258}  # 1/√3
seed: 11
ticks: 60
channels:
  - {type: weyl_bcc, name: weyl, sign: "+"}
  - {type: gluon_bcc, name: gluon}
  - {type: gravity_dielectric, name: gravity, M: 1.0, sigma: 3.0, G: 1.0}
observers:
  - {type: norm_conservation, every: 5}
  - {type: unitarity_residual, every: 60}
  - {type: dispersion_fit, every: 60}
  - {type: energy_trace, every: 10}
  - {type: field_snapshot, every: 60}
output:
  json: test-results/casim_bcc_fields_companion.json
