# FB09 — sqrt(sigma)/f_pi from the two QCD calibrations (F124).
# Spectral (compute-once) solve of the factorisation
#   sqrt(sigma)/f_pi = (Lambda/f_pi) x (sqrt(sigma)/Lambda)
# = chiral (Pagels-Stokar, Lambda/f_pi = 7.04 exact) x confinement (condensate
# sigma = 2 pi v^2 at the BZ cutoff). field_snapshot writes the axis/sphere
# values (4.00 / 3.23) vs the empirical 4.56. Pure numpy, sandbox-fast.
#
# The Monte-Carlo confinement cross-check (sigma from a 3+1D SU(3) lattice) is a
# SEPARATE run via the gauge_mc scenario (see FB09 brief):
#   casim run scenarios/gauge_mc.yaml --L 8 --ticks 40 --out test-results/FB09_sigma_smoke.json
version: 2
name: string_tension_fpi
title: "sqrt(sigma)/f_pi (FB09)"
description: "The two QCD calibrations reconciled: (Lambda/f_pi)(sqrt(sigma)/Lambda) via condensate axis/sphere BZ conventions, scored against the empirical sqrt(sigma)/f_pi = 4.56."
lattice: {L: 4, topology: cubic, c_lat: 1.0}
seed: 0
ticks: 1
channels:
  - {type: string_tension, name: sigma_fpi}
observers:
  - {type: field_snapshot, every: 1}
output:
  json: test-results/casim_string_tension_fpi.json
