# FB03 — the pion as the chiral-symmetry-breaking Goldstone (F77/F103).
# Spectral (compute-once) NJL gap + RPA-ladder solve: one coupling G fixes the
# constituent mass and the meson poles. A "tick" runs the solve once; the
# field_snapshot observer dumps m_c, m_pi, m_sigma, f_pi, <qbar q>, the GMOR
# residual, and the chiral-limit Goldstone check (m0->0 => m_pi->0) to JSON.
# Sandbox-fast pure-numpy quadrature; lattice geometry is nominal (unused).
name: njl_pion
title: "NJL Pion Sector (FB03)"
description: "Dynamical light-meson spectrum from the canonical SU(2) NJL fit: pion/sigma poles, f_pi, condensate, GMOR slope, and the chiral-limit Goldstone theorem."
lattice: {L: 4, topology: cubic, c_lat: 1.0}
seed: 0
ticks: 1
channels:
  - {type: njl_meson, name: pion}
    # optional overrides (defaults = F77 canonical fit, GeV):
    #   Lam: 0.6515, GLam2: 2.10, m0: 0.0055, g_rhopipi: 6.0
observers:
  - {type: field_snapshot, every: 1}
output:
  json: test-results/casim_njl_pion.json
